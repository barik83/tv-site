<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My TV Site</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
margin:0;
padding:20px;
}
video{
width:100%;
max-width:900px;
}
button{
padding:10px;
margin:5px;
}
</style>
</head>

<body>

<h1>Live TV</h1>

<video id="video" controls autoplay></video>

<br><br>

<button onclick="playChannel('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
Demo Channel
</button>

<script>
function playChannel(url){
const video=document.getElementById('video');

if(Hls.isSupported()){
const hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}else{
video.src=url;
}
}

playChannel('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8');
</script>

</body>
</html>
