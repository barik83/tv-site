<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Site</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    background:#0f172a;
    color:#fff;
    font-family:Arial,sans-serif;
}
header{
    padding:15px;
    text-align:center;
    background:#111827;
}
input,select{
    padding:10px;
    border:none;
    border-radius:8px;
    margin:5px;
}
.controls{
    text-align:center;
    padding:10px;
}
video{
    width:100%;
    max-height:500px;
    background:#000;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:10px;
    padding:15px;
}
.card{
    background:#1e293b;
    border-radius:12px;
    padding:10px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
}
.card:hover{
    transform:scale(1.03);
}
.card img{
    width:80px;
    height:80px;
    object-fit:contain;
}
</style>
</head>

<body>

<header>
<h1>📺 TV Site</h1>
</header>

<video id="video" controls autoplay></video>

<div class="controls">
<input type="text" id="search" placeholder="Search Channel">
<select id="category">
<option value="all">All Categories</option>
</select>
</div>

<div class="grid" id="channels"></div>

<script>

let channels=[];

fetch("channels.json")
.then(r=>r.json())
.then(data=>{
    channels=data;
    loadCategories();
    render(channels);
});

function loadCategories(){
    let cats=[...new Set(channels.map(c=>c.category))];

    let sel=document.getElementById("category");

    cats.forEach(c=>{
        let o=document.createElement("option");
        o.value=c;
        o.textContent=c;
        sel.appendChild(o);
    });
}

function render(list){

let container=document.getElementById("channels");

container.innerHTML="";

list.forEach(ch=>{

container.innerHTML+=`
<div class="card"
onclick="playChannel('${ch.url}')">

<img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/80'">

<h4>${ch.name}</h4>

</div>
`;

});

}

function playChannel(url){

let video=document.getElementById("video");

if(Hls.isSupported()){

let hls=new Hls();

hls.loadSource(url);

hls.attachMedia(video);

}else{

video.src=url;

}

}

document.getElementById("search").addEventListener("input",filter);

document.getElementById("category").addEventListener("change",filter);

function filter(){

let q=document.getElementById("search").value.toLowerCase();

let cat=document.getElementById("category").value;

let result=channels.filter(c=>{

let name=c.name.toLowerCase().includes(q);

let category=cat==="all"||c.category===cat;

return name&&category;

});

render(result);

}

</script>

</body>
</html>
