<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium IPTV+</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:#fff;
}

header{
background:#111827;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

video{
width:100%;
height:240px;
background:#000;
}

.player-controls{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:8px;
padding:10px;
background:#111827;
}

.player-controls button{
padding:10px 14px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:14px;
}

.search-box{
padding:10px;
text-align:center;
}

.search-box input,
.search-box select{
padding:10px;
border:none;
border-radius:8px;
margin:5px;
width:45%;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:12px;
padding:12px;
}

.card{
background:#1e293b;
border-radius:12px;
padding:10px;
text-align:center;
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:80px;
height:80px;
object-fit:contain;
}

.card h4{
margin-top:8px;
font-size:14px;
}

.counter{
text-align:center;
padding:10px;
font-size:18px;
font-weight:bold;
}
</style>
</head>

<body>

<header>📺 Premium IPTV+</header>

<video id="video" controls autoplay></video>

<div class="player-controls">

<button onclick="prevChannel()">⏮️ Prev</button>

<button onclick="document.getElementById('video').play()">▶️ Play</button>

<button onclick="document.getElementById('video').pause()">⏸️ Pause</button>

<button onclick="nextChannel()">⏭️ Next</button>

<button onclick="document.getElementById('video').volume=Math.max(0,document.getElementById('video').volume-0.1)">🔉</button>

<button onclick="document.getElementById('video').volume=Math.min(1,document.getElementById('video').volume+0.1)">🔊</button>

<button onclick="document.getElementById('video').muted=!document.getElementById('video').muted">🔇</button>

<button onclick="document.getElementById('video').requestFullscreen()">⛶ Full</button>

<button onclick="addCurrentFavorite()">❤️ Favorite</button>

</div>

<div class="counter" id="count">Channels: 0</div>

<div class="search-box">

<input type="text" id="search" placeholder="Search Channel">

<select id="category">
<option value="all">All Categories</option>
</select>

</div>

<div class="grid" id="channels"></div>

<script>

let channels=[];
let currentIndex=0;

const categoryFiles = [
"bangla.json",
"bangla-news.json",
"educational.json",
"india.json",
"international-news.json",
"international.json",
"kids.json",
"movies.json",
"music.json",
"pakistan.json",
"sports.json",
"travel.json"
];

async function loadChannels(){

channels=[];

for(const file of categoryFiles){

try{

const res = await fetch("channels/"+file);
const data = await res.json();

const category = file.replace(".json","");

data.forEach(ch=>{
ch.category = category;
channels.push(ch);
});

}catch(err){
console.log(err);
}

}

document.getElementById("count").innerHTML =
"Channels: "+channels.length;

loadCategories();
render(channels);

}

loadChannels();

async function loadChannels(){

channels=[];

for(const file of categoryFiles){

try{

const res = await fetch("channels/"+file);
const data = await res.json();

const category = file.replace(".json","");

data.forEach(ch=>{
ch.category = category;
channels.push(ch);
});

}catch(err){
console.log(err);
}

}

document.getElementById("count").innerHTML =
"Channels: "+channels.length;

loadCategories();
render(channels);

}

loadChannels();

function loadCategories(){

let cats=[...new Set(channels.map(c=>c.category))];

let sel=document.getElementById("category");

cats.forEach(c=>{

let o=document.createElement("option");

o.value=c;

o.textContent=c;

sel.appendChild(o);

});

}

function render(list){

let container=document.getElementById("channels");

container.innerHTML="";

list.forEach(ch=>{

container.innerHTML+=`
<div class="card" onclick="playChannel('${ch.url}')">

<img src="${ch.logo}"
onerror="this.src='https://via.placeholder.com/80'">

<h4>${ch.name}</h4>

</div>
`;

});

}

function playChannel(url){

currentIndex=
channels.findIndex(c=>c.url===url);

let video=document.getElementById("video");

if(Hls.isSupported()){

let hls=new Hls();

hls.loadSource(url);

hls.attachMedia(video);

}else{

video.src=url;

}

}

function nextChannel(){

if(currentIndex<channels.length-1){

currentIndex++;

playChannel(channels[currentIndex].url);

}

}

function prevChannel(){

if(currentIndex>0){

currentIndex--;

playChannel(channels[currentIndex].url);

}

}

function addCurrentFavorite(){

if(!channels[currentIndex]) return;

let fav=
JSON.parse(localStorage.getItem("favorites")||"[]");

if(!fav.includes(channels[currentIndex].name)){

fav.push(channels[currentIndex].name);

}

localStorage.setItem(
"favorites",
JSON.stringify(fav)
);

alert(channels[currentIndex].name+" added to favorites");

}

document.getElementById("search")
.addEventListener("input",filter);

document.getElementById("category")
.addEventListener("change",filter);

function filter(){

let q=document.getElementById("search")
.value.toLowerCase();

let cat=document.getElementById("category").value;

let result=channels.filter(c=>{

let name=c.name.toLowerCase().includes(q);

let category=
cat==="all" || c.category===cat;

return name && category;

});

render(result);

}

</script>

</body>
</html>
