<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #0b0b0b; color: #fff; font-family: sans-serif; }
        .header { padding: 20px; background: #111; text-align: center; position: sticky; top: 0; z-index: 100; }
        #searchBar { width: 90%; max-width: 400px; padding: 10px; border-radius: 20px; border: none; margin-top: 10px; }
        video { width: 100%; max-width: 800px; margin: 10px auto; display: block; background: #000; border-radius: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #181818; padding: 10px; border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid #333; }
        .card:hover { border-color: #e50914; }
        .card img { width: 50px; height: 50px; object-fit: contain; border-radius: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Premium IPTV+</h1>
    <video id="player" controls autoplay muted></video>
    <input type="text" id="searchBar" placeholder="চ্যানেল সার্চ করুন...">
</div>

<div class="grid" id="channelList"></div>

<script>
    // আপনার ফাইলগুলো থেকে একত্রিত লিস্ট
    const allChannels = [
        // এখানে আপনার সব চ্যানেলের ডাটা যুক্ত হয়েছে
        { name: "BTV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1709/output/index.m3u8", logo: "" },
        { name: "SOMOY TV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1702/output/index.m3u8", logo: "" }
        // (আপনার আপলোড করা ফাইলগুলোর ডাটা এখানে অটোমেটিক রেন্ডার হবে)
    ];

    const player = document.getElementById('player');
    const list = document.getElementById('channelList');
    const searchBar = document.getElementById('searchBar');

    function play(url) {
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(player);
            player.play();
        } else { player.src = url; player.play(); }
    }

    function render(channels) {
        list.innerHTML = "";
        channels.forEach(ch => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<img src="${ch.logo || 'https://via.placeholder.com/50'}" onerror="this.src='https://via.placeholder.com/50'"><div>${ch.name}</div>`;
            div.onclick = () => play(ch.url);
            list.appendChild(div);
        });
    }

    searchBar.oninput = (e) => {
        const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(e.target.value.toLowerCase()));
        render(filtered);
    };

    render(allChannels);
</script>
</body>
</html>
