<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Premium IPTV</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W97TS7J98P"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-W97TS7J98P');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body{margin:0;background:#0b0b0b;color:#fff;font-family:system-ui}
        .header{padding:15px;background:linear-gradient(90deg,#111,#1f1f1f);position:sticky;top:0;z-index:10}
        .search{width:100%;padding:12px;border-radius:25px;border:none;background:#222;color:#fff;box-sizing: border-box;}
        .hero{
            padding:15px;
            position:sticky;
            top:80px;
            z-index:5;
            background:#0b0b0b;
        }
        video{width:100%;height:230px;background:#000;border-radius:14px}
        
        /* প্লেয়ার কন্ট্রোলস ডিজাইন */
        .player-controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 10px; background: #111; border-radius: 10px; margin-top: 8px; transition: opacity 0.3s; }
        .player-controls.hidden { display: none !important; }
        .player-controls button { padding: 8px 12px; border: none; border-radius: 6px; background: #222; color: #fff; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .player-controls button:hover { background: #ff4757; }

        .tabs{display:flex;gap:8px;padding:10px;overflow-x:auto;scrollbar-width:none}
        .tabs::-webkit-scrollbar{display:none}
        .tabs button{padding:10px 18px;border-radius:20px;border:none;background:#1a1a1a;color:#fff;white-space:nowrap;cursor:pointer}
        .tabs button.active{background:#ff4757;font-weight:bold}
        
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;padding:15px}
        .card{background:#161616;padding:10px;border-radius:12px;text-align:center;cursor:pointer;border:1px solid #222;transition:0.2s}
        .card:hover{border-color:#ff4757;transform:scale(1.03)}
        .card img{width:50px;height:50px;object-fit:contain;border-radius:8px;margin-bottom:6px}
        .card div{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header">
        <input id="search" class="search" placeholder="Search channels..." oninput="filterChannels()">
    </div>

    <div class="hero">
        <video id="player" controls autoplay></video>
        
        <div class="player-controls" id="controlsContainer">
            <button onclick="prevChannel()">⏮️ Prev</button>
            <button onclick="document.getElementById('player').play()">▶️ Play</button>
            <button onclick="document.getElementById('player').pause()">⏸️ Pause</button>
            <button onclick="nextChannel()">⏭️ Next</button>
            <button onclick="changeVolume(-0.1)">🔉 Vol -</button>
            <button onclick="changeVolume(0.1)">🔊 Vol +</button>
            <button onclick="toggleMute()">🔇 Mute</button>
            <button onclick="document.getElementById('player').requestFullscreen()">⛶ Full</button>
            <button onclick="toggleLockScreen()">🔒 Lock</button>
        </div>
    </div>

    <div class="tabs">
        <button class="active" onclick="filterCategory('all', this)">All</button>
        <button onclick="filterCategory('Live TV', this)">Live TV</button>
        <button onclick="filterCategory('Sports', this)">Sports</button>
        <button onclick="filterCategory('News', this)">News</button>
        <button onclick="filterCategory('Movies', this)">Movies</button>
        <button onclick="filterCategory('Entertainment', this)">Entertainment</button>
        <button onclick="filterCategory('Music', this)">Music</button>
        <button onclick="filterCategory('Kids', 'Kids')">Kids</button>
        <button onclick="filterCategory('Infotainment', this)">Infotainment</button>
        <button onclick="filterCategory('Religious', this)">Religious</button>
        <button onclick="filterCategory('Radio', this)">Radio</button>
    </div>

    <div class="grid" id="channelGrid">
        <div class="card" data-name="Somoy TV" data-category="News" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
            <img src="https://via.placeholder.com/50" alt="Logo">
            <div>Somoy TV</div>
        </div>
        <div class="card" data-name="T Sports" data-category="Sports" onclick="playStream('https://content.jwplatform.com/manifests/vM7wCIzo.m3u8')">
            <img src="https://via.placeholder.com/50" alt="Logo">
            <div>T Sports</div>
        </div>
        </div>

    <script>
        let currentChannelIndex = 0;
        let isLocked = false;
        let controlsTimeout;
        const player = document.getElementById('player');
        const controls = document.getElementById('controlsContainer');

        // HLS স্ট্রিম প্লেয়ার ফাংশন
        function playStream(url) {
            if (isLocked) return alert("Player is locked!");
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    player.play();
                });
            } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
                player.src = url;
                player.addEventListener('loadedmetadata', function() {
                    player.play();
                });
            }
        }

        // ভলিউম কন্ট্রোল
        function changeVolume(amount) {
            player.volume = Math.min(1, Math.max(0, player.volume + amount));
        }

        function toggleMute() {
            player.muted = !player.muted;
        }

        // লক স্ক্রিন
        function toggleLockScreen() {
            isLocked = !isLocked;
            const lockBtn = document.querySelector("button[onclick='toggleLockScreen()']");
            if (isLocked) {
                lockBtn.innerText = "🔓 Unlock";
                player.controls = false;
                controls.classList.add('hidden');
            } else {
                lockBtn.innerText = "🔒 Lock";
                player.controls = true;
                controls.classList.remove('hidden');
            }
        }

        // ৩ সেকেন্ড পর অটো কন্ট্রোল বাটন হাইড হওয়ার লজিক
        function showControls() {
            if (isLocked) return;
            controls.classList.remove('hidden');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                controls.classList.add('hidden');
            }, 3000);
        }
        player.addEventListener('click', showControls);
        showControls();

        // নেক্সট ও প্রিভিয়াস চ্যানেল চেঞ্জ লজিক
        function nextChannel() {
            const visibleChannels = document.querySelectorAll('.card:not(.hidden)');
            if(visibleChannels.length > 0) {
                currentChannelIndex = (currentChannelIndex + 1) % visibleChannels.length;
                visibleChannels[currentChannelIndex].click();
            }
        }

        function prevChannel() {
            const visibleChannels = document.querySelectorAll('.card:not(.hidden)');
            if(visibleChannels.length > 0) {
                currentChannelIndex = (currentChannelIndex - 1 + visibleChannels.length) % visibleChannels.length;
                visibleChannels[currentChannelIndex].click();
            }
        }

        // সার্চ বার ফিল্টারিং
        function filterChannels() {
            const query = document.getElementById('search').value.toLowerCase();
            const channels = document.querySelectorAll('.card');
            
            channels.forEach(channel => {
                const name = channel.getAttribute('data-name').toLowerCase();
                if (name.includes(query)) {
                    channel.classList.remove('hidden');
                } else {
                    channel.classList.add('hidden');
                }
            });
        }

        // ক্যাটাগরি ফিল্টারিং
        function filterCategory(category, button) {
            document.querySelectorAll('.tabs button').forEach(btn => btn.classList.remove('active'));
            if(typeof button === 'object') button.classList.add('active');

            const channels = document.querySelectorAll('.card');
            channels.forEach(channel => {
                const chanCat = channel.getAttribute('data-category');
                if (category === 'all' || chanCat === category) {
                    channel.classList.remove('hidden');
                } else {
                    channel.classList.add('hidden');
                }
            });
            currentChannelIndex = 0;
        }
    </script>
</body>
</html>
