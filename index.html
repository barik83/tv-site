
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Premium IPTV+</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --primary: #e50914;
            --bg-main: #0b0b0b;
            --bg-card: #181818;
            --text-light: #ffffff;
            --text-muted: #aaaaaa;
        }

        body { margin:0; background:var(--bg-main); color:var(--text-light); font-family:system-ui, sans-serif; user-select:none; }
        
        /* Video Player Section */
        .hero { padding: 10px; position: sticky; top: 0; z-index: 20; background: var(--bg-main); border-bottom: 1px solid #222; box-shadow: 0 4px 10px rgba(0,0,0,0.7); }
        video { width:100%; max-height:250px; aspect-ratio: 16/9; background:#000; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.6); outline: none; display: block; margin: 0 auto; }
        
        .now-playing { text-align: center; margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .now-playing span { color: var(--text-light); font-weight: 400; }

        .player-controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:8px; margin-top:5px; background:#141414; border-radius:10px; }
        .player-controls button { padding:8px 14px; border:none; border-radius:6px; background:#262626; color:#fff; cursor:pointer; font-size:13px; font-weight:500; transition:all 0.2s ease;}
        .player-controls button:hover { background:var(--primary); transform: scale(1.05); }
        
        /* Search Bar */
        .header { padding: 15px 15px 5px 15px; background: var(--bg-main); }
        .search { width:100%; padding:12px 20px; border-radius:25px; border:1px solid #333; background:#222; color:#fff; box-sizing:border-box; outline:none; font-size:14px; transition: 0.3s; }
        .search:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(229,9,20,0.3); }
        
        /* Category Tabs */
        .tabs { display:flex; gap:8px; padding:10px; overflow-x:auto; scrollbar-width:none; background:#111; border-radius:8px; margin:5px 15px; }
        .tabs::-webkit-scrollbar { display:none; }
        .tab { background:#222; padding:10px 18px; border-radius:20px; border:1px solid transparent; color:#fff; cursor:pointer; white-space:nowrap; font-size:13px; font-weight:500; transition:all 0.3s ease; }
        .tab:hover { background: #333; }
        .tab.active { background:var(--primary); color:#fff; font-weight:bold; box-shadow:0 2px 8px rgba(229,9,20,0.4); border-color: #ff4757; }
        
        /* Channel Grid */
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; padding:15px; padding-bottom: 40px;}
        .card { background:var(--bg-card); border-radius:14px; padding:12px; cursor:pointer; text-align:center; border:2px solid transparent; transition:all 0.3s ease; position:relative; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card:hover { border-color:var(--primary); transform:translateY(-4px); }
        .card.playing { border-color: var(--primary); background: #2a0808; }
        
        .logo { height:60px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:8px; background: #000; border-radius: 8px; padding: 5px;}
        .logo img { max-height:50px; max-width:100%; object-fit:contain; border-radius:4px; }
        
        .name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px; }
        .category-tag { font-size: 10px; color: var(--text-muted); margin-top: 4px; display: block;}
        
        .fav-btn { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.5); border:none; color:#777; font-size:16px; cursor:pointer; transition:all 0.2s; z-index:2; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;}
        .fav-btn.active { color:#ff4757; }
        
        .no-results { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); font-size: 16px;}
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-box { background: #3b0909; border: 1px solid #ff4757; padding: 15px; border-radius: 8px; color: #fff; margin: 10px 15px; font-size: 13px; display: none; }
        .error-box h4 { margin: 0 0 10px 0; color: #ff4757; }
        .error-box ul { margin: 0; padding-left: 20px; }
    </style>
</head>
<body>

<div class="hero">
    <video id="player" controls autoplay playsinline></video>
    <div id="nowPlaying" class="now-playing">▶️ <span>Loading channels...</span></div>
    <div class="player-controls">
        <button onclick="prevChannel()" title="Previous Channel">⏮️ Prev</button>
        <button onclick="document.getElementById('player').play()">▶️</button>
        <button onclick="document.getElementById('player').pause()">⏸️</button>
        <button onclick="nextChannel()" title="Next Channel">⏭️ Next</button>
        <button onclick="document.getElementById('player').volume = Math.max(0, document.getElementById('player').volume - 0.1)">🔉 Vol-</button>
        <button onclick="document.getElementById('player').volume = Math.min(1, document.getElementById('player').volume + 0.1)">🔊 Vol+</button>
        <button onclick="document.getElementById('player').requestFullscreen()">⛶ Full</button>
    </div>
</div>

<div class="header">
    <input id="search" class="search" placeholder="🔍 Search channels or categories...">
</div>

<div class="tabs" id="categoryTabs">
    <button class="tab active" onclick="switchCategory('all', this)">🌐 All</button>
    <button class="tab" onclick="switchCategory('Bangladesh', this)">🇧🇩 Bangladesh</button>
    <button class="tab" onclick="switchCategory('India', this)">🇮🇳 India</button>
    <button class="tab" onclick="switchCategory('Pakistan', this)">🇵🇰 Pakistan</button>
    <button class="tab" onclick="switchCategory('News', this)">📰 News</button>
    <button class="tab" onclick="switchCategory('Movies', this)">🎬 Movies</button>
    <button class="tab" onclick="switchCategory('Music', this)">🎵 Music</button>
    <button class="tab" onclick="switchCategory('Sports', this)">⚽ Sports</button>
    <button class="tab" onclick="switchCategory('Kids', this)">👶 Kids</button>
    <button class="tab" onclick="switchCategory('Educational', this)">📚 Educational</button>
    <button class="tab" onclick="switchCategory('International', this)">🌍 International</button>
    <button class="tab" onclick="switchCategory('Live TV', this)">📺 Live TV</button>
    <button class="tab" onclick="switchCategory('favorites', this)">❤️ Favorites</button>
</div>

<div id="errorContainer" class="error-box">
    <h4>⚠️ কিছু ফাইলে সমস্যা পাওয়া গেছে:</h4>
    <ul id="errorList"></ul>
</div>

<div class="grid" id="channelGrid">
    <div id="gridContent" style="grid-column: 1/-1;">
        <div class="no-results">
            <div class="loader"></div>
            Connecting to server and loading channels...
        </div>
    </div>
</div>

<script>
// আপনার ১০টি JSON ফাইলের লিস্ট
const fileNamesToLoad = [
    'bangla.json', 
    'bangla-news.json', 
    'movies.json', 
    'music.json',
    'india.json', 
    'kids.json', 
    'educational.json', 
    'international.json',
    'international-news.json', 
    'live-tv.json'
];

let channels = [];
let favorites = [];
let failedFiles = []; 

try {
    favorites = JSON.parse(localStorage.getItem('iptv_favorites')) || [];
} catch (e) {
    favorites = [];
}

let currentCategory = 'all';
let currentFilteredList = [];
let currentIndex = 0;
let hlsInstance = null;

const player = document.getElementById('player');
const grid = document.getElementById('channelGrid');
const search = document.getElementById('search');
const nowPlayingText = document.getElementById('nowPlaying');
const errorContainer = document.getElementById('errorContainer');
const errorList = document.getElementById('errorList');

// ফাইল ফেচ করার ফাংশন
async function fetchFile(fileName) {
    const cacheBuster = '?v=' + new Date().getTime(); 
    const pathsToTry = [`./${fileName}`, `/${fileName}`, fileName];
    
    for (let path of pathsToTry) {
        try {
            let res = await fetch(path + cacheBuster);
            if (res.ok) {
                try {
                    let data = await res.json();
                    return Array.isArray(data) ? data : [];
                } catch (parseError) {
                    failedFiles.push(`<b>${fileName}</b> : এই ফাইলে কমা (,) বা কোডিং ভুল আছে।`);
                    return [];
                }
            }
        } catch (e) {}
    }
    failedFiles.push(`<b>${fileName}</b> : ফাইলটি সার্ভারে পাওয়া যায়নি।`);
    return [];
}

async function loadAllChannels() {
    try {
        const fetchPromises = fileNamesToLoad.map(name => fetchFile(name));
        const results = await Promise.all(fetchPromises);
        
        results.forEach(dataArray => {
            if (Array.isArray(dataArray)) {
                dataArray.forEach(channel => {
                    if (!channels.find(c => c.url === channel.url)) {
                        channels.push(channel);
                    }
                });
            }
        });

        if (failedFiles.length > 0) {
            errorContainer.style.display = 'block';
            failedFiles.forEach(err => {
                let li = document.createElement('li');
                li.innerHTML = err;
                errorList.appendChild(li);
            });
        }

        if (channels.length > 0) {
            const gridLoader = document.getElementById('gridContent');
            if(gridLoader) gridLoader.remove();
            applyFilters();
            if (currentFilteredList.length > 0) {
                play(currentFilteredList[0].url, currentFilteredList[0].name);
            }
        } else {
            grid.innerHTML = '<div class="no-results" style="color: #ff4757;">⚠️ কোনো চ্যানেল পাওয়া যায়নি! JSON ফাইলগুলো আপলোড করা আছে কিনা চেক করুন।</div>';
            nowPlayingText.innerHTML = `⚠️ <span>No channels loaded</span>`;
        }
    } catch (error) {
        console.error("Error:", error);
    }
}

function saveFavorites() { localStorage.setItem('iptv_favorites', JSON.stringify(favorites)); }

function toggleFavorite(channelName, event) {
    event.stopPropagation();
    const idx = favorites.indexOf(channelName);
    if (idx > -1) favorites.splice(idx, 1);
    else favorites.push(channelName);
    
    saveFavorites();
    if (currentCategory === 'favorites') applyFilters();
    else render(currentFilteredList);
}

// ভিডিও প্লেয়ার লজিক
function play(url, channelName) {
    nowPlayingText.innerHTML = `▶️ Now Playing: <span>${channelName || 'Live Stream'}</span>`;
    
    if (hlsInstance) { 
        hlsInstance.destroy(); 
        hlsInstance = null; 
    }

    if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('m3u8'))) {
        hlsInstance = new Hls({ 
            maxMaxBufferLength: 30,
            enableWorker: true,
            lowLatencyMode: true
        });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(player);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            player.play().catch(e => console.log("Play interrupted"));
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    hlsInstance.startLoad();
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    hlsInstance.recoverMediaError();
                } else { 
                    hlsInstance.destroy(); 
                    nowPlayingText.innerHTML = `⚠️ <span>Stream offline: ${channelName}</span>`; 
                }
            }
        });
    } else {
        player.src = url;
        player.play().catch(e => console.log("Play interrupted"));
    }
    highlightActiveCard();
}

function render(list) {
    const cards = grid.querySelectorAll('.card, .no-results');
    cards.forEach(c => c.remove());

    if (list.length === 0) { 
        let noRes = document.createElement('div');
        noRes.className = 'no-results';
        noRes.innerHTML = 'No channels found for this category 📺';
        grid.appendChild(noRes); 
        return; 
    }

    list.forEach((c, idx) => {
        const isFav = favorites.includes(c.name);
        const isPlaying = (currentFilteredList[currentIndex] && currentFilteredList[currentIndex].url === c.url) ? 'playing' : '';
        let d = document.createElement('div');
        d.className = `card ${isPlaying}`;
        d.innerHTML = `
            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${c.name.replace(/'/g, "\\'")}', event)">
                ${isFav ? '❤️' : '🤍'}
            </button>
            <div class="logo">${c.logo ? '<img src="' + c.logo + '" onerror="this.parentElement.innerHTML=\'📺\'">' : '📺'}</div>
            <div class="name">${c.name}</div>
            <div class="category-tag">${c.category || 'Other'}</div>
        `;
        d.onclick = () => { currentIndex = idx; play(c.url, c.name); };
        grid.appendChild(d);
    });
}

function switchCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if (btn) btn.classList.add('active');
    applyFilters();
}

// স্মার্ট ক্যাটাগরি ফিল্টার 
function applyFilters() {
    let filtered = [...channels];
    if (currentCategory === 'favorites') {
        filtered = filtered.filter(c => favorites.includes(c.name));
    } else if (currentCategory !== 'all') {
        filtered = filtered.filter(c => {
            const cat = (c.category || '').toLowerCase();
            const target = currentCategory.toLowerCase();
            
            if (target === 'bangladesh' && (cat.includes('bangla') || cat.includes('bangladesh') || cat.includes('bd'))) return true;
            if (target === 'india' && cat.includes('india')) return true;
            if (target === 'pakistan' && cat.includes('pakistan')) return true;
            if (target === 'news' && cat.includes('news')) return true;
            if (target === 'international' && cat.includes('international')) return true;
            if (target === 'music' && cat.includes('music')) return true;
            if (target === 'movies' && (cat.includes('movie') || cat.includes('cinema'))) return true;
            if (target === 'sports' && cat.includes('sport')) return true;
            if (target === 'kids' && cat.includes('kid')) return true;
            
            if (cat === target) return true;
            return false;
        });
    }
    
    const query = search.value.toLowerCase().trim();
    if (query) {
        filtered = filtered.filter(c => c.name.toLowerCase().includes(query) || (c.category && c.category.toLowerCase().includes(query)));
    }
    
    currentFilteredList = filtered;
    render(currentFilteredList);
}

function nextChannel() {
    if (currentFilteredList.length > 0) {
        currentIndex = (currentIndex + 1) % currentFilteredList.length;
        play(currentFilteredList[currentIndex].url, currentFilteredList[currentIndex].name);
    }
}

function prevChannel() {
    if (currentFilteredList.length > 0) {
        currentIndex = (currentIndex - 1 + currentFilteredList.length) % currentFilteredList.length;
        play(currentFilteredList[currentIndex].url, currentFilteredList[currentIndex].name);
    }
}

function highlightActiveCard() {
    const cards = grid.querySelectorAll('.card');
    cards.forEach((c, idx) => {
        if (idx === currentIndex) { 
            c.classList.add('playing'); 
            c.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); 
        } else { 
            c.classList.remove('playing'); 
        }
    });
}

search.addEventListener('input', applyFilters);

loadAllChannels();

</script>
</body>
</html>
