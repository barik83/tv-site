<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium IPTV Web Player</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        /* Modern Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Premium Glassmorphism */
        .glass-panel {
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        /* Premium Neon Green Custom Sliders */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #00E676; /* Neon Green */
            cursor: pointer;
            margin-top: -4px;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.6);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }
        
        /* Vertical Slider for Gesture Controls */
        .vertical-slider {
            -webkit-appearance: slider-vertical;
            width: 6px;
            height: 110px;
            accent-color: #00E676;
        }

        /* Fullscreen Wrapper Integration */
        #video-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            background-color: black;
        }

        .neon-glow {
            text-shadow: 0 0 8px rgba(0, 230, 118, 0.6);
        }
        .neon-bg-glow {
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans selection:bg-[#00E676] selection:text-black">

    <div id="loading-screen" class="fixed inset-0 bg-gray-950 flex flex-col items-center justify-center z-[9999] transition-opacity duration-500">
        <div class="w-16 h-16 border-4 border-[#00E676] border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-[#00E676] font-semibold tracking-wider neon-glow">Loading Premium IPTV...</p>
    </div>

    <main class="w-full mx-auto pt-4 px-2 sm:px-4 pb-12 md:max-w-4xl lg:max-w-[1200px] xl:max-w-[1400px]">
        
        <section class="w-full mb-6 flex justify-center">
            <div id="video-wrapper" class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-900 flex items-center justify-center group">
                
                <video id="main-video-player" class="absolute inset-0 w-full h-full object-contain bg-black transition-all duration-300" playsinline></video>
                
                <div id="center-hud" class="absolute pointer-events-none glass-panel px-4 py-2 rounded-full flex items-center space-x-2 shadow-2xl z-40 opacity-0 transition-opacity duration-300">
                    <i class="fa-solid fa-expand text-sm text-gray-300"></i>
                    <span id="hud-text" class="text-sm font-semibold tracking-wide">100% Display / Scale</span>
                </div>

                <div id="channel-popup" class="absolute top-6 left-1/2 -translate-x-1/2 glass-panel px-6 py-2 rounded-full text-[#00E676] font-bold text-lg shadow-xl opacity-0 translate-y-[-20px] transition-all duration-300 z-50 pointer-events-none neon-glow">
                    <span id="popup-text">Channel Name</span>
                </div>

                <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 bg-black z-10 pointer-events-none">
                    <i class="fa-solid fa-play fa-4x opacity-50 mb-4 text-[#00E676] drop-shadow-[0_0_15px_rgba(0,230,118,0.5)] animate-pulse"></i>
                    <p class="text-sm font-semibold tracking-wide text-gray-400">Select a channel to play</p>
                </div>

                <div id="master-controls" class="absolute inset-0 z-20 opacity-0 transition-opacity duration-500 bg-gradient-to-t from-black/40 via-transparent to-black/20">
                    
                    <div class="absolute left-6 top-1/2 -translate-y-1/2 flex flex-col items-center space-y-2">
                        <span id="brightness-txt" class="text-[10px] font-bold text-gray-300">100%</span>
                        <input type="range" id="brightness-slider" min="30" max="150" value="100" class="vertical-slider cursor-pointer">
                        <i class="fa-solid fa-sun text-sm text-[#00E676] neon-glow"></i>
                    </div>

                    <div class="absolute right-6 top-1/2 -translate-y-1/2 flex flex-col items-center space-y-2">
                        <span id="volume-txt" class="text-[10px] font-bold text-gray-300">100%</span>
                        <input type="range" id="volume-slider" min="0" max="100" value="100" class="vertical-slider cursor-pointer">
                        <i id="vol-icon" class="fa-solid fa-volume-high text-sm text-[#00E676] neon-glow"></i>
                    </div>

                    <div class="absolute right-16 top-1/2 -translate-y-1/2 flex flex-col space-y-3">
                        <button id="next-channel-btn" title="Next Channel" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-white hover:text-[#00E676] hover:scale-110 active:scale-95 transition-all shadow-lg">
                            <i class="fa-solid fa-chevron-up text-sm"></i>
                        </button>
                        <button id="prev-channel-btn" title="Previous Channel" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-white hover:text-[#00E676] hover:scale-110 active:scale-95 transition-all shadow-lg">
                            <i class="fa-solid fa-chevron-down text-sm"></i>
                        </button>
                    </div>

                    <button onclick="togglePanel('advanced-settings-panel')" class="absolute top-4 right-4 w-10 h-10 rounded-full glass-panel flex items-center justify-center text-white hover:text-[#00E676] transition-all">
                        <i class="fa-solid fa-gear"></i>
                    </button>

                    <div id="advanced-settings-panel" class="absolute top-16 right-4 hidden glass-panel rounded-2xl w-72 p-4 shadow-2xl z-50 animate-fade-in">
                        <div class="grid grid-cols-4 gap-2 mb-4 border-b border-gray-800 pb-4 text-center">
                            <button onclick="mockFeature('Audio Track')" class="flex flex-col items-center hover:text-[#00E676] transition-colors"><i class="fa-solid fa-language text-lg mb-1"></i><span class="text-[9px] font-bold tracking-tight">Audio</span></button>
                            <button onclick="mockFeature('Equalizer')" class="flex flex-col items-center hover:text-[#00E676] transition-colors"><i class="fa-solid fa-sliders text-lg mb-1"></i><span class="text-[9px] font-bold tracking-tight">EQ</span></button>
                            <button onclick="mockFeature('Chromecast')" class="flex flex-col items-center hover:text-[#00E676] transition-colors"><i class="fa-brands fa-chromecast text-lg mb-1"></i><span class="text-[9px] font-bold tracking-tight">Cast</span></button>
                            <button onclick="cycleAspectRatio()" class="flex flex-col items-center hover:text-[#00E676] transition-colors"><i class="fa-solid fa-crop-simple text-lg mb-1"></i><span id="aspect-btn-txt" class="text-[9px] font-bold tracking-tight">16:9</span></button>
                        </div>
                        <div class="flex justify-around items-center mb-4 border-b border-gray-800 pb-3">
                            <button onclick="toggleActiveState(this)" class="text-gray-400 hover:text-[#00E676] transition-colors"><i class="fa-regular fa-star text-base"></i></button>
                            <button onclick="toggleActiveState(this)" class="text-gray-400 hover:text-[#00E676] transition-colors"><i class="fa-regular fa-bookmark text-base"></i></button>
                            <button onclick="mockFeature('VR 360° Mode')" class="text-gray-400 hover:text-[#00E676] transition-colors"><i class="fa-solid fa-vr-cardboard text-base"></i></button>
                            <button id="quality-btn" onclick="togglePanel('quality-panel')" class="text-xs border border-gray-600 rounded px-2 py-0.5 hover:border-[#00E676] text-gray-300 hover:text-[#00E676] font-bold hidden">Auto</button>
                        </div>
                        <div>
                            <h4 class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-2">Play Settings</h4>
                            <div class="grid grid-cols-4 gap-2">
                                <button onclick="toggleActiveState(this)" title="AB Repeat" class="glass-panel p-2 rounded-xl flex items-center justify-center hover:bg-gray-800 transition text-xs"><i class="fa-solid fa-repeat"></i></button>
                                <button onclick="toggleNightMode(this)" title="Night Mode" class="glass-panel p-2 rounded-xl flex items-center justify-center hover:bg-gray-800 transition text-xs"><i class="fa-solid fa-moon"></i></button>
                                <button onclick="toggleMirrorMode(this)" title="Mirror Mode" class="glass-panel p-2 rounded-xl flex items-center justify-center hover:bg-gray-800 transition text-xs"><i class="fa-solid fa-arrows-left-right"></i></button>
                                <button onclick="mockFeature('Sleep Timer')" title="Sleep Timer" class="glass-panel p-2 rounded-xl flex items-center justify-center hover:bg-gray-800 transition text-xs"><i class="fa-solid fa-clock"></i></button>
                            </div>
                        </div>
                    </div>

                    <div id="quality-panel" class="absolute top-36 right-36 hidden glass-panel rounded-xl overflow-hidden w-32 flex flex-col z-50"></div>

                    <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black via-black/80 to-transparent p-4 pt-10 flex flex-col space-y-3">
                        
                        <div class="flex items-center space-x-3 w-full">
                            <span class="text-[10px] font-bold text-gray-300">00:00:00</span>
                            <input type="range" id="seek-bar" min="0" max="100" value="100" class="w-full cursor-not-allowed" disabled>
                            <span class="text-[10px] font-bold text-[#00E676] tracking-wider neon-glow">LIVE</span>
                        </div>

                        <div class="flex items-center justify-between w-full px-2">
                            <div class="flex items-center space-x-4">
                                <div class="flex items-center text-red-500 font-bold text-xs tracking-wider glass-panel px-2.5 py-1 rounded-lg border border-red-500/20">
                                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse mr-2 shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span> LIVE
                                </div>
                                <button id="speed-btn" onclick="cyclePlaybackSpeed()" class="text-xs font-bold bg-white/10 px-2.5 py-1.5 rounded-lg border border-white/5 hover:text-[#00E676] transition-colors">1.0x</button>
                            </div>

                            <div class="flex items-center">
                                <button id="play-pause-btn" class="w-11 h-11 bg-[#00E676] text-black rounded-full flex items-center justify-center text-base hover:scale-105 active:scale-95 transition shadow-[0_0_15px_rgba(0,230,118,0.4)]">
                                    <i class="fa-solid fa-pause"></i>
                                </button>
                            </div>

                            <div class="flex items-center space-x-4">
                                <button onclick="cycleAspectRatio()" title="Screen Fit" class="text-gray-400 hover:text-white transition"><i class="fa-solid fa-compress text-base"></i></button>
                                
                                <div class="relative group/pip">
                                    <button id="pip-btn" class="text-gray-400 hover:text-[#00E676] transition-all"><i class="fa-regular fa-window-restore text-base"></i></button>
                                    <div class="absolute bottom-full right-0 mb-3 w-44 bg-[#00E676] text-black text-[9px] font-black p-2 rounded-lg shadow-2xl opacity-0 group-hover/pip:opacity-100 transition-opacity pointer-events-none z-50">
                                        Watching videos in floating Pop-up window
                                        <div class="absolute -bottom-1 right-3 w-2 h-2 bg-[#00E676] rotate-44"></div>
                                    </div>
                                </div>

                                <button id="fullscreen-btn" class="text-gray-400 hover:text-[#00E676] transition-all text-base"><i class="fa-solid fa-expand"></i></button>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </section>

        <section class="w-full mb-4">
            <div class="relative w-full sm:w-1/2 lg:w-1/3 mx-auto px-1">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="channel-search" placeholder="Search channels..." class="w-full bg-[#131926] border border-gray-800 text-white text-sm rounded-full focus:ring-1 focus:ring-[#00E676] focus:border-[#00E676] block pl-10 p-2.5 transition-colors outline-none shadow-2xl">
            </div>
        </section>

        <section class="w-full mb-6">
            <div class="flex overflow-x-auto space-x-3 no-scrollbar py-2 px-1" id="category-tabs"></div>
        </section>

        <section class="w-full">
            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3 sm:gap-4" id="channel-grid"></div>
        </section>
    </main>

    <script>
        const DOM = {
            loader: document.getElementById('loading-screen'),
            videoWrapper: document.getElementById('video-wrapper'),
            video: document.getElementById('main-video-player'),
            placeholder: document.getElementById('player-placeholder'),
            masterControls: document.getElementById('master-controls'),
            panels: ['advanced-settings-panel', 'quality-panel'],
            sliders: {
                brightness: document.getElementById('brightness-slider'),
                volume: document.getElementById('volume-slider')
            },
            txt: {
                brightness: document.getElementById('brightness-txt'),
                volume: document.getElementById('volume-txt')
            },
            channelPopup: document.getElementById('channel-popup'),
            popupText: document.getElementById('popup-text'),
            qualityPanel: document.getElementById('quality-panel'),
            qualityBtn: document.getElementById('quality-btn'),
            volIcon: document.getElementById('vol-icon'),
            playPauseBtn: document.getElementById('play-pause-btn'),
            speedBtn: document.getElementById('speed-btn'),
            aspectBtnTxt: document.getElementById('aspect-btn-txt'),
            centerHud: document.getElementById('center-hud'),
            hudText: document.getElementById('hud-text'),
            tabsContainer: document.getElementById('category-tabs'),
            gridContainer: document.getElementById('channel-grid'),
            searchInput: document.getElementById('channel-search')
        };

        let currentChannelsData = [];
        let currentPlayingIndex = -1;
        let hlsPlayer = null;
        let controlsTimer;
        let popupTimer;
        let hudTimer;
        
        let aspectRatios = ['object-contain', 'object-cover', 'object-fill'];
        let aspectLabels = ['16:9', 'Zoom', 'Stretch'];
        let currentAspectIdx = 0;
        let playSpeeds = [1.0, 1.25, 1.5, 2.0];
        let currentSpeedIdx = 0;

        // --- 1. Startup Handler ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                DOM.loader.style.opacity = "0";
                setTimeout(() => DOM.loader.classList.add('hidden'), 500);
            }, 800);
        });

        // --- 2. Smart HUD Controls Auto-fade Engine ---
        function resetControlsTimer() {
            DOM.masterControls.style.opacity = '1';
            DOM.videoWrapper.style.cursor = 'default';
            clearTimeout(controlsTimer);
            
            controlsTimer = setTimeout(() => {
                if(!DOM.video.paused) {
                    DOM.masterControls.style.opacity = '0';
                    DOM.videoWrapper.style.cursor = 'none';
                    closeAllPanels();
                }
            }, 3500);
        }

        ['mousemove', 'touchstart', 'click'].forEach(evt => {
            DOM.videoWrapper.addEventListener(evt, resetControlsTimer);
        });

        function closeAllPanels() {
            DOM.panels.forEach(id => document.getElementById(id).classList.add('hidden'));
        }

        window.togglePanel = function(panelId) {
            const panel = document.getElementById(panelId);
            const isHidden = panel.classList.contains('hidden');
            if(panelId === 'advanced-settings-panel') DOM.qualityPanel.classList.add('hidden');
            else if(panelId === 'quality-panel') DOM.advancedSettingsPanel.classList.add('hidden');
            
            if (isHidden) panel.classList.remove('hidden');
            else panel.classList.add('hidden');
            resetControlsTimer();
        };

        // Block event bubblings inside floating control menus
        DOM.panels.forEach(id => {
            document.getElementById(id).addEventListener('click', e => e.stopPropagation());
        });

        // --- 3. Synchronized Interactive Sliders ---
        DOM.sliders.brightness.addEventListener('input', (e) => {
            DOM.video.style.filter = `brightness(${e.target.value}%)`;
            DOM.txt.brightness.innerText = `${e.target.value}%`;
            resetControlsTimer();
        });

        DOM.sliders.volume.addEventListener('input', (e) => {
            const vol = e.target.value / 100;
            DOM.video.volume = vol;
            DOM.txt.volume.innerText = `${e.target.value}%`;
            if(vol === 0) DOM.volIcon.className = 'fa-solid fa-volume-xmark text-red-500';
            else if(vol < 0.5) DOM.volIcon.className = 'fa-solid fa-volume-low text-[#00E676] neon-glow';
            else DOM.volIcon.className = 'fa-solid fa-volume-high text-[#00E676] neon-glow';
            resetControlsTimer();
        });

        // --- 4. Advanced HUD Controls (Toggles & Action Handlers) ---
        function triggerHUD(text) {
            DOM.hudText.innerText = text;
            DOM.centerHud.classList.remove('opacity-0');
            DOM.centerHud.classList.add('opacity-100');
            clearTimeout(hudTimer);
            hudTimer = setTimeout(() => DOM.centerHud.classList.remove('opacity-100'), 1500);
        }

        window.cycleAspectRatio = function() {
            currentAspectIdx = (currentAspectIdx + 1) % aspectRatios.length;
            aspectRatios.forEach(cls => DOM.video.classList.remove(cls));
            DOM.video.classList.add(aspectRatios[currentAspectIdx]);
            DOM.aspectBtnTxt.innerText = aspectLabels[currentAspectIdx];
            triggerHUD(`Scale: ${aspectLabels[currentAspectIdx]}`);
        };

        window.cyclePlaybackSpeed = function() {
            currentSpeedIdx = (currentSpeedIdx + 1) % playSpeeds.length;
            DOM.video.playbackRate = playSpeeds[currentSpeedIdx];
            DOM.speedBtn.innerText = `${playSpeeds[currentSpeedIdx]}x`;
            triggerHUD(`Speed: ${playSpeeds[currentSpeedIdx]}x`);
        };

        window.toggleMirrorMode = function(btn) {
            DOM.video.classList.toggle('scale-x-[-1]');
            btn.classList.toggle('text-[#00E676]');
            triggerHUD(DOM.video.classList.contains('scale-x-[-1]') ? "Mirror Mode: On" : "Mirror Mode: Off");
        };

        window.toggleNightMode = function(btn) {
            btn.classList.toggle('text-[#00E676]');
            if(btn.classList.contains('text-[#00E676]')) {
                DOM.video.style.setProperty('filter', 'sepia(45%) saturate(110%) brightness(90%)');
                triggerHUD("Night Mode Blue-Filter: On");
            } else {
                DOM.video.style.filter = `brightness(${DOM.sliders.brightness.value}%)`;
                triggerHUD("Night Mode Blue-Filter: Off");
            }
        };

        window.toggleActiveState = function(btn) {
            btn.classList.toggle('text-[#00E676]');
        };

        window.mockFeature = function(featureName) {
            triggerHUD(`${featureName} Activated`);
        };

        // Play Pause Core Sync Toggle
        DOM.playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if(DOM.video.paused) {
                DOM.video.play();
                DOM.playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                DOM.video.pause();
                DOM.playPauseBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
            }
        });

        // Picture In Picture Interface Trigger
        document.getElementById('pip-btn').addEventListener('click', async (e) => {
            e.stopPropagation();
            try {
                if (DOM.video !== document.pictureInPictureElement) {
                    await DOM.video.requestPictureInPicture();
                } else {
                    await document.exitPictureInPicture();
                }
            } catch (err) {
                console.error("PiP Engine Fail", err);
            }
        });

        // --- 5. Channel Up/Down Stepper Mechanics ---
        function showChannelPopup(name) {
            DOM.popupText.innerText = name;
            DOM.channelPopup.classList.remove('opacity-0', 'translate-y-[-20px]');
            DOM.channelPopup.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(popupTimer);
            popupTimer = setTimeout(() => {
                DOM.channelPopup.classList.remove('opacity-100', 'translate-y-0');
                DOM.channelPopup.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 2000);
        }

        document.getElementById('next-channel-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentChannelsData.length > 0) playChannel((currentPlayingIndex + 1) % currentChannelsData.length);
        });

        document.getElementById('prev-channel-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentChannelsData.length > 0) playChannel((currentPlayingIndex - 1 + currentChannelsData.length) % currentChannelsData.length);
        });

        // --- 6. Hardware Adaptable Video Quality Engines ---
        function updateQualityMenu(levels) {
            DOM.qualityPanel.innerHTML = '';
            if (!levels || levels.length <= 1) {
                DOM.qualityBtn.classList.add('hidden');
                return;
            }
            DOM.qualityBtn.classList.remove('hidden');
            DOM.qualityBtn.innerText = 'Auto';
            createQualityOption('Auto', -1, true);

            const sortedLevels = levels.slice().reverse();
            sortedLevels.forEach((level, index) => {
                const originalIndex = levels.length - 1 - index;
                let label = level.height ? level.height + 'p' : 'HQ';
                if(level.height === 1080) label = '1080p FHD';
                if(level.height === 720) label = '720p HD';
                if(level.height === 480) label = '480p SD';
                createQualityOption(label, originalIndex, false);
            });
        }

        function createQualityOption(label, levelIndex, isAuto) {
            const btn = document.createElement('button');
            btn.className = `block w-full px-4 py-2 text-xs text-left hover:bg-gray-800 hover:text-[#00E676] transition-colors border-b border-gray-800 last:border-0 ${isAuto ? 'font-bold text-[#00E676]' : 'text-gray-300'}`;
            btn.innerText = label;
            btn.onclick = (e) => {
                e.stopPropagation();
                hlsPlayer.currentLevel = levelIndex;
                DOM.qualityBtn.innerText = label.split(' ')[0];
                Array.from(DOM.qualityPanel.children).forEach(child => child.classList.remove('text-[#00E676]', 'font-bold'));
                btn.classList.add('text-[#00E676]', 'font-bold');
                closeAllPanels();
            };
            DOM.qualityPanel.appendChild(btn);
        }

        // Display Fullscreen Layout Engine Toggle
        document.getElementById('fullscreen-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                if (DOM.videoWrapper.requestFullscreen) DOM.videoWrapper.requestFullscreen();
                document.getElementById('fullscreen-btn').innerHTML = '<i class="fa-solid fa-compress"></i>';
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                document.getElementById('fullscreen-btn').innerHTML = '<i class="fa-solid fa-expand"></i>';
            }
            closeAllPanels();
        });

        // --- 7. Channels JSON Router Catalogs ---
        const categoryFiles = [
            { name: "Buno All", file: "./channels/bunoall.json" },
            { name: "Bangla News", file: "./channels/bangla-news.json" },
            { name: "Bangla", file: "./channels/bangla.json" },
            { name: "Live TV", file: "./channels/live-tv.json" },
            { name: "India", file: "./channels/india.json" },
            { name: "Movies", file: "./channels/movies.json" },
            { name: "Kids", file: "./channels/kids.json" },
            { name: "Music", file: "./channels/music.json" },
            { name: "Educational", file: "./channels/educational.json" },
            { name: "International", file: "./channels/international.json" },
            { name: "Pakistan", file: "./channels/pakistan.json" },
            { name: "Religious", file: "./channels/religious.json" }
        ];

        function initTabs() {
            categoryFiles.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.className = index === 0 
                    ? "px-5 py-2 rounded-full text-sm font-bold bg-[#00E676] text-black flex-shrink-0 shadow-lg shadow-[#00E676]/30 font-black"
                    : "px-5 py-2 rounded-full text-sm font-bold bg-[#1e293b] text-gray-300 flex-shrink-0 hover:bg-[#334155] transition-colors";
                btn.textContent = cat.name;
                btn.onclick = () => {
                    Array.from(DOM.tabsContainer.children).forEach(b => b.className = "px-5 py-2 rounded-full text-sm font-bold bg-[#1e293b] text-gray-300 flex-shrink-0 hover:bg-[#334155] transition-colors");
                    btn.className = "px-5 py-2 rounded-full text-sm font-bold bg-[#00E676] text-black flex-shrink-0 shadow-lg shadow-[#00E676]/30 font-black";
                    DOM.searchInput.value = '';
                    loadChannelData(cat.file);
                };
                DOM.tabsContainer.appendChild(btn);
            });
            loadChannelData(categoryFiles[0].file);
        }

        async function loadChannelData(fileName) {
            DOM.gridContainer.innerHTML = '<div class="col-span-full text-center py-12"><i class="fa-solid fa-spinner animate-spin text-2xl text-[#00E676]"></i></div>';
            try {
                const response = await fetch(fileName);
                const data = await response.json();
                currentChannelsData = data;
                renderChannels(currentChannelsData);
            } catch (error) {
                DOM.gridContainer.innerHTML = '<p class="text-red-400 col-span-full text-center py-8">Failed to fetch local database channels.</p>';
            }
        }

        // Live Real-time Input Searching Engine
        DOM.searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = currentChannelsData.filter(channel => 
                channel.name.toLowerCase().includes(searchTerm)
            );
            renderChannels(filtered, true);
        });

        // Fast Core HLS Engine Processing Launcher
        function playChannel(index, dataArray = currentChannelsData) {
            if (index < 0 || index >= dataArray.length) return;
            
            const channel = dataArray[index];
            currentPlayingIndex = currentChannelsData.findIndex(c => c.url === channel.url);
            
            const cleanName = channel.name.replace(/^(BD\s*\|\s*|IN\s*\|\s*|EN\s*\|\s*|OTHER\s*\|\s*|TR\s*\|\s*|ENT\s*\|\s*)/i, '').trim();
            
            DOM.placeholder.classList.add('hidden');
            showChannelPopup(cleanName);
            resetControlsTimer();
            closeAllPanels();

            if (Hls.isSupported()) {
                if (hlsPlayer) hlsPlayer.destroy();
                
                // --- ULTRA-FAST PERFORMANCE DRIVEN LOW LATENCY OPTIMIZATIONS ---
                hlsPlayer = new Hls({ 
                    capLevelToPlayerSize: true,
                    enableWorker: true,
                    lowLatencyMode: true,
                    maxBufferLength: 4,      // Extremely low buffer lengths for faster zapping
                    maxMaxBufferLength: 8,
                    liveSyncDurationCount: 1.5,
                    liveMaxLatencyDurationCount: 3,
                    manifestLoadingTimeOut: 5000,
                    manifestLoadingMaxRetry: 2
                }); 
                
                hlsPlayer.loadSource(channel.url);
                hlsPlayer.attachMedia(DOM.video);
                
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    DOM.video.play();
                    DOM.playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                    updateQualityMenu(data.levels);
                });

                hlsPlayer.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) triggerHUD("Link expired or unable to load stream.");
                });
            } else if (DOM.video.canPlayType('application/vnd.apple.mpegurl')) {
                DOM.video.src = channel.url;
                DOM.video.play();
                DOM.playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                DOM.qualityBtn.classList.add('hidden'); 
            }
        }

        function renderChannels(channels, isFiltered = false) {
            DOM.gridContainer.innerHTML = '';
            if (channels.length === 0) {
                DOM.gridContainer.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">No channels matching criteria found</p>';
                return;
            }

            channels.forEach((channel, index) => {
                const cleanName = channel.name.replace(/^(BD\s*\|\s*|IN\s*\|\s*|EN\s*\|\s*|OTHER\s*\|\s*|TR\s*\|\s*|ENT\s*\|\s*)/i, '').trim();
                const card = document.createElement('button');
                card.className = "aspect-square bg-gray-900/40 backdrop-blur rounded-2xl flex flex-col items-center justify-center p-3 hover:-translate-y-1.5 hover:shadow-[0_8px_20px_rgba(0,230,118,0.15)] transition-all duration-300 group border border-white/5 focus:outline-none focus:ring-1 focus:ring-[#00E676]";
                
                const logoHtml = channel.logo 
                    ? `<img src="${channel.logo}" alt="${cleanName}" class="w-14 h-14 object-contain rounded-full bg-white p-1 mb-3 group-hover:scale-110 transition-transform">`
                    : `<div class="w-14 h-14 rounded-full bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center text-[#00E676] font-bold text-xl mb-3 border border-gray-700/50">${cleanName.charAt(0)}</div>`;

                card.innerHTML = `${logoHtml}<span class="text-xs font-semibold text-gray-300 text-center truncate w-full group-hover:text-[#00E676] transition-colors">${cleanName}</span>`;

                card.onclick = () => {
                    playChannel(index, channels);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                DOM.gridContainer.appendChild(card);
            });
        }

        initTabs();
    </script>
</body>
</html>
