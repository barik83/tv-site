<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ সুপার ফাস্ট IPTV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0a1a; color:#e0e0e0; font-family:system-ui,sans-serif; padding:10px; min-height:100vh; }
        .container { max-width:960px; margin:0 auto; }
        .card { background:#141428; border-radius:14px; padding:14px; margin-bottom:12px; border:1px solid #2a2a4a; }
        .flex { display:flex; gap:8px; flex-wrap:wrap; }
        .flex input { flex:1; padding:10px 14px; border-radius:10px; border:none; background:#1a1a30; color:#fff; font-size:14px; min-width:150px; }
        .flex button { padding:10px 18px; border-radius:10px; border:none; background:#00e676; color:#000; font-weight:bold; cursor:pointer; transition:0.2s; font-size:14px; white-space:nowrap; }
        .flex button:active { transform:scale(0.95); }
        .video-box { background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/9; position:relative; }
        .video-box video { width:100%; height:100%; display:block; }
        .video-box .placeholder { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#555; pointer-events:none; }
        .video-box .placeholder i { font-size:48px; color:#00e676; margin-bottom:8px; }
        .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; justify-content:center; align-items:center; }
        .controls button { padding:8px 18px; border-radius:8px; border:none; background:#1a1a30; color:#fff; cursor:pointer; font-size:14px; }
        .controls button:active { transform:scale(0.94); }
        .controls input[type="range"] { width:100px; margin:0; background:#2a2a4a; height:4px; border-radius:4px; accent-color:#00e676; }
        .tab-wrap { display:flex; overflow-x:auto; gap:5px; padding:4px 0; flex-wrap:nowrap; scrollbar-width:none; }
        .tab-wrap::-webkit-scrollbar { display:none; }
        .tab-wrap button { flex:0 0 auto; padding:5px 14px; border-radius:20px; font-size:12px; background:#1a1a30; color:#aaa; border:1px solid #2a2a4a; white-space:nowrap; cursor:pointer; transition:0.2s; }
        .tab-wrap button.active { background:#00e676; color:#000; border-color:#00e676; }
        .tab-wrap button.bangla-tab { background:#004d40; color:#00e676; border-color:#00e676; }
        .tab-wrap button.bangla-tab.active { background:#00e676; color:#000; }
        .tab-wrap button.sports-tab { background:#1a237e; color:#ffd54f; border-color:#ffd54f; }
        .tab-wrap button.sports-tab.active { background:#ffd54f; color:#000; }
        .channel-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:6px; max-height:400px; overflow-y:auto; padding-right:4px; }
        .channel-grid .ch { background:#1a1a30; border-radius:10px; padding:8px 4px; text-align:center; cursor:pointer; border:1px solid #2a2a4a; transition:0.15s; font-size:11px; line-height:1.2; }
        .channel-grid .ch:active { transform:scale(0.94); }
        .channel-grid .ch img { width:32px; height:32px; object-fit:contain; border-radius:50%; background:#fff; padding:2px; margin-bottom:3px; }
        .channel-grid .ch .name { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:#ccc; font-size:11px; }
        .channel-grid .ch .group { font-size:8px; color:#666; margin-top:2px; }
        .stats { font-size:12px; color:#888; text-align:center; padding:4px 0; }
        #searchInput { width:100%; padding:10px 14px; border-radius:10px; border:1px solid #2a2a4a; background:#1a1a30; color:#fff; font-size:14px; margin-bottom:10px; outline:none; }
        #searchInput:focus { border-color:#00e676; }
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:#1a1a30; }
        ::-webkit-scrollbar-thumb { background:#00e676; border-radius:4px; }
        @media (max-width:480px) { .channel-grid { grid-template-columns:repeat(3,1fr); } }
        .loading-text { text-align:center; color:#888; padding:20px; }
        .error-text { text-align:center; color:#ff6b6b; padding:20px; }
        .badge-bangla { background:#00e676; color:#000; font-size:8px; padding:1px 6px; border-radius:10px; margin-left:4px; }
        .badge-sports { background:#ffd54f; color:#000; font-size:8px; padding:1px 6px; border-radius:10px; margin-left:4px; }
    </style>
</head>
<body>
<div class="container">

    <!-- হেডার -->
    <div class="card" style="text-align:center;padding:12px;">
        <h1 style="color:#00e676;font-size:22px;letter-spacing:1px;">⚡ সুপার ফাস্ট IPTV</h1>
        <div style="font-size:12px;color:#888;">বাংলা · খেলা · বিশ্ব — সব এক জায়গায়</div>
    </div>

    <!-- লোড ফর্ম -->
    <div class="card">
        <div class="flex">
            <input type="text" id="m3uUrl" placeholder="M3U লিংক দিন..." value="https://iptv-org.github.io/iptv/index.m3u">
            <button id="loadBtn">🚀 লোড</button>
        </div>
        <div style="font-size:11px;color:#666;margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;">
            <span>🔹 <b>বাংলা</b>: iptv-org/bd.m3u</span>
            <span>🔹 <b>খেলা</b>: কাস্টম স্ট্রিম</span>
            <span>🔹 <b>সব</b>: ২০,০০০+ চ্যানেল</span>
        </div>
    </div>

    <!-- প্লেয়ার -->
    <div class="card">
        <div class="video-box">
            <video id="player" playsinline muted></video>
            <div class="placeholder" id="placeholder">
                <i class="fa-solid fa-satellite-dish"></i>
                <span>চ্যানেল সিলেক্ট করুন</span>
            </div>
        </div>
        <div class="controls">
            <button id="playBtn">⏸️</button>
            <button id="prevBtn">◀</button>
            <button id="nextBtn">▶</button>
            <input type="range" id="volumeSlider" min="0" max="100" value="80">
            <span style="font-size:12px;color:#888;" id="volLabel">80%</span>
        </div>
    </div>

    <!-- ক্যাটাগরি ট্যাব -->
    <div class="card" style="padding:10px 14px;">
        <div class="tab-wrap" id="tabContainer">
            <button class="active" data-cat="All">🌟 সব</button>
        </div>
    </div>

    <!-- চ্যানেল লিস্ট -->
    <div class="card">
        <input type="text" id="searchInput" placeholder="🔍 চ্যানেল খুঁজুন...">
        <div id="channelList" class="channel-grid">
            <div class="loading-text">⏳ প্লেলিস্ট লোড হচ্ছে...</div>
        </div>
        <div class="stats" id="stats">০ টি চ্যানেল</div>
    </div>

</div>

<!-- ফন্টঅসাম CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
    (function() {
        'use strict';

        // DOM
        const $ = id => document.getElementById(id);
        const m3uUrl = $('m3uUrl');
        const loadBtn = $('loadBtn');
        const player = $('player');
        const placeholder = $('placeholder');
        const playBtn = $('playBtn');
        const prevBtn = $('prevBtn');
        const nextBtn = $('nextBtn');
        const volumeSlider = $('volumeSlider');
        const volLabel = $('volLabel');
        const tabContainer = $('tabContainer');
        const channelList = $('channelList');
        const searchInput = $('searchInput');
        const stats = $('stats');

        // স্টেট
        let allChannels = [];
        let currentChannels = [];
        let currentPlayingIndex = -1;
        let currentCategory = 'All';
        let hls = null;
        let isPlaying = false;
        let isLoading = false;

        // ===== ক্যাটাগরি অর্ডার (বাংলা প্রথম, তারপর খেলা) =====
        const CATEGORY_ORDER = [
            { id: 'bangla', label: '🇧🇩 বাংলা', class: 'bangla-tab' },
            { id: 'sports', label: '⚽ খেলা', class: 'sports-tab' },
            { id: 'All', label: '🌟 সব', class: '' }
        ];

        // ===== প্রি-লোড করা স্ট্রিম (খেলার জন্য) =====
        const SPORTS_STREAMS = [
            { name: 'FOX Sports USA', url: 'https://nhjjhhjhjjhfjj.pages.dev/1782613232/f1c0e9e8a0cd474396744490e359170c/3X6yUmQuRDmCzatTemcXcUW0dSkj1mciuKiqPuSzp_Q/fox-sports-1.m3u8' },
            { name: 'FOX 4K USA', url: 'https://nhjjhhjhjjhfjj.pages.dev/1782612924/803e1fd1f4734294ac3c82f8fe38fbba/M7HR84ZtuTB0VixXVbhLBkOlHYVGROX_j5owv64t_3s/fox4k-usa.m3u8' },
            { name: 'FOX Sports 4K', url: 'https://nhjjhhjhjjhfjj.pages.dev/1782613080/f627592d843645dd93ed293c8d6e317a/v1y7cPiVDACKjMFBr2Xuv3qjMhRqRXvFE0gYosCmxAg/fox-sports-1-4k.m3u8' },
            { name: 'FOX USA', url: 'https://nhjjhhjhjjhfjj.pages.dev/17826131/64/f24e2dba327042279b769de40c9762a2/Sb_BZ4fmEg0gvT4VpnLXmJ-x_oktndhjeiK_rSqCZ6M/fox-usa.m3u8' }
        ];

        // ===== পার্সার (দ্রুত) =====
        function parseM3U(text, source = 'default') {
            const lines = text.split('\n');
            const channels = [];
            let current = null;
            const catSet = new Set();

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,([^,]+)$/);
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    let group = groupMatch ? groupMatch[1].trim() : 'General';
                    // বাংলা চ্যানেল চিহ্নিত করা
                    if (source === 'bd' || /bangla|বাংলা|bd|bangladesh/i.test(group) || /bangla|বাংলা/i.test(nameMatch ? nameMatch[1] : '')) {
                        group = '🇧🇩 বাংলা';
                    }
                    catSet.add(group);
                    current = {
                        name: nameMatch ? nameMatch[1].trim() : 'Unknown',
                        logo: logoMatch ? logoMatch[1] : '',
                        group: group,
                        url: ''
                    };
                } else if (line.startsWith('http') && current) {
                    current.url = line;
                    if (!channels.some(c => c.url === current.url)) {
                        channels.push(current);
                    }
                    current = null;
                }
            }
            const categories = ['All', ...Array.from(catSet).sort()];
            return { channels, categories };
        }

        // ===== ট্যাব রেন্ডার (অর্ডার অনুযায়ী) =====
        function renderTabs(categories) {
            tabContainer.innerHTML = '';
            
            // প্রি-ডিফাইন্ড অর্ডার অনুযায়ী ট্যাব তৈরি
            const orderedTabs = [];
            const catSet = new Set(categories);
            
            // বাংলা ও খেলা ক্যাটাগরি থাকলে সেগুলো আগে দেখাবে
            if (catSet.has('🇧🇩 বাংলা')) {
                orderedTabs.push({ id: 'bangla', label: '🇧🇩 বাংলা', class: 'bangla-tab' });
            }
            if (catSet.has('⚽ খেলা') || catSet.has('Sports')) {
                orderedTabs.push({ id: 'sports', label: '⚽ খেলা', class: 'sports-tab' });
            }
            // বাকি ক্যাটাগরি
            const remaining = Array.from(catSet).filter(c => c !== 'All' && c !== '🇧🇩 বাংলا' && c !== '⚽ খেলা' && c !== 'Sports');
            remaining.sort();
            remaining.forEach(c => {
                orderedTabs.push({ id: c, label: c, class: '' });
            });
            // সব ক্যাটাগরি
            orderedTabs.unshift({ id: 'All', label: '🌟 সব', class: '' });

            orderedTabs.forEach((tab, idx) => {
                const btn = document.createElement('button');
                btn.dataset.cat = tab.id;
                btn.textContent = tab.label;
                if (tab.class) btn.className = tab.class;
                if (tab.id === currentCategory) btn.classList.add('active');
                btn.onclick = () => {
                    document.querySelectorAll('.tab-wrap button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = tab.id;
                    applyFilter();
                };
                tabContainer.appendChild(btn);
            });
        }

        // ===== ফিল্টার =====
        function applyFilter() {
            const search = searchInput.value.trim().toLowerCase();
            let filtered = allChannels;
            
            if (currentCategory === 'bangla') {
                filtered = filtered.filter(ch => ch.group === '🇧🇩 বাংলা');
            } else if (currentCategory === 'sports') {
                filtered = filtered.filter(ch => ch.group === '⚽ খেলা' || ch.group === 'Sports');
            } else if (currentCategory !== 'All') {
                filtered = filtered.filter(ch => ch.group === currentCategory);
            }
            
            if (search) {
                filtered = filtered.filter(ch => ch.name.toLowerCase().includes(search));
            }
            currentChannels = filtered;
            renderChannels(filtered);
            stats.textContent = filtered.length + ' টি চ্যানেল';
        }

        // ===== চ্যানেল রেন্ডার =====
        function renderChannels(channels) {
            channelList.innerHTML = '';
            if (!channels || channels.length === 0) {
                channelList.innerHTML = '<div style="grid-column:span 3;text-align:center;color:#666;padding:20px;">কোনো চ্যানেল নেই</div>';
                return;
            }

            const frag = document.createDocumentFragment();
            channels.forEach((ch, idx) => {
                const div = document.createElement('div');
                div.className = 'ch';
                const name = ch.name.replace(/^(BD\s*\|\s*|IN\s*\|\s*|EN\s*\|\s*|OTHER\s*\|\s*|TR\s*\|\s*|ENT\s*\|\s*)/i, '').trim();
                const logoHtml = ch.logo
                    ? `<img loading="lazy" onerror="this.style.display='none'" src="${ch.logo}" alt="">`
                    : `<div style="width:32px;height:32px;border-radius:50%;background:#2a2a4a;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;color:#00e676;font-size:14px;margin-bottom:3px;">${name.charAt(0).toUpperCase()}</div>`;
                const badge = ch.group === '🇧🇩 বাংলা' ? '<span class="badge-bangla">বাংলা</span>' : 
                              (ch.group === '⚽ খেলা' || ch.group === 'Sports') ? '<span class="badge-sports">খেলা</span>' : '';
                div.innerHTML = `
                    ${logoHtml}
                    <div class="name">${name} ${badge}</div>
                    <div class="group">${ch.group}</div>
                `;
                div.onclick = () => playChannel(idx);
                frag.appendChild(div);
            });
            channelList.appendChild(frag);
        }

        // ===== প্লে চ্যানেল =====
        function playChannel(index) {
            if (index < 0 || index >= currentChannels.length) return;
            const ch = currentChannels[index];
            currentPlayingIndex = index;
            placeholder.style.display = 'none';

            if (hls) { hls.destroy(); hls = null; }

            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    maxBufferLength: 20,
                    liveSyncDuration: 3,
                    manifestLoadingMaxRetry: 2,
                    fragLoadingMaxRetry: 2,
                });
                hls.loadSource(ch.url);
                hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    player.volume = volumeSlider.value / 100;
                    player.play().catch(() => { player.muted = true; player.play(); });
                    isPlaying = true;
                    playBtn.textContent = '⏸️';
                });
                hls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                        else { hls.destroy(); }
                    }
                });
            } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
                player.src = ch.url;
                player.play();
                isPlaying = true;
                playBtn.textContent = '⏸️';
            } else {
                alert('HLS সাপোর্ট নেই');
            }
        }

        // ===== M3U লোড (একাধিক) =====
        async function loadMultipleM3U(urls) {
            if (isLoading) return;
            isLoading = true;
            channelList.innerHTML = '<div class="loading-text">⏳ প্লেলিস্ট লোড হচ্ছে...</div>';
            
            let combinedChannels = [];
            let allCategories = new Set();
            
            // স্পোর্টস স্ট্রিম যোগ
            SPORTS_STREAMS.forEach(stream => {
                combinedChannels.push({
                    name: stream.name,
                    logo: '',
                    group: '⚽ খেলা',
                    url: stream.url
                });
                allCategories.add('⚽ খেলা');
            });

            for (const url of urls) {
                try {
                    const resp = await fetch(url, { mode: 'cors' });
                    if (!resp.ok) continue;
                    const text = await resp.text();
                    const source = url.includes('bd.m3u') ? 'bd' : 'default';
                    const { channels, categories } = parseM3U(text, source);
                    combinedChannels = combinedChannels.concat(channels);
                    categories.forEach(c => allCategories.add(c));
                } catch (err) {
                    console.warn('Failed to load:', url, err);
                }
            }

            if (combinedChannels.length === 0) {
                channelList.innerHTML = '<div class="error-text">❌ কোনো চ্যানেল পাওয়া যায়নি</div>';
                isLoading = false;
                return;
            }

            allChannels = combinedChannels;
            currentCategory = 'All';
            renderTabs([...allCategories]);
            applyFilter();
            stats.textContent = combinedChannels.length + ' টি চ্যানেল';
            isLoading = false;
        }

        // ===== ইভেন্ট =====
        loadBtn.onclick = () => {
            const url = m3uUrl.value.trim();
            if (url) {
                // ডিফল্ট + বাংলা + কাস্টম
                const urls = [
                    'https://iptv-org.github.io/iptv/index.m3u',
                    'https://iptv-org.github.io/iptv/countries/bd.m3u',
                    'https://raw.githubusercontent.com/Monjil404/TVspo/refs/heads/main/tvs'
                ];
                // ইউজারের দেওয়া URL যোগ করা
                if (url && !urls.includes(url)) {
                    urls.push(url);
                }
                loadMultipleM3U(urls);
            }
        };

        playBtn.onclick = () => {
            if (player.paused) {
                player.play().catch(() => {});
                playBtn.textContent = '⏸️';
                isPlaying = true;
            } else {
                player.pause();
                playBtn.textContent = '▶️';
                isPlaying = false;
            }
        };

        prevBtn.onclick = () => {
            if (currentChannels.length === 0) return;
            const idx = (currentPlayingIndex - 1 + currentChannels.length) % currentChannels.length;
            playChannel(idx);
        };

        nextBtn.onclick = () => {
            if (currentChannels.length === 0) return;
            const idx = (currentPlayingIndex + 1) % currentChannels.length;
            playChannel(idx);
        };

        volumeSlider.oninput = () => {
            const val = volumeSlider.value;
            player.volume = val / 100;
            if (player.muted) player.muted = false;
            volLabel.textContent = val + '%';
        };

        searchInput.oninput = applyFilter;

        // ডিফল্ট লোড (সব প্লেলিস্ট একসাথে)
        loadBtn.click();

        // এন্টার কী
        m3uUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadBtn.click(); });

        // ভলিউম ডিফল্ট
        player.volume = 0.8;

    })();
</script>
</body>
</html>
