<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern IPTV Web Player</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        /* Modern Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Modern Range Sliders */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #06b6d4; /* Cyan 500 */
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        /* Vertical Slider */
        .vertical-slider {
            -webkit-appearance: slider-vertical;
            width: 6px;
            height: 100px;
        }

        /* Fullscreen Video Wrapper */
        #video-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            background-color: black;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans selection:bg-cyan-500 selection:text-white">

    <div id="loading-screen" class="fixed inset-0 bg-gray-950 flex flex-col items-center justify-center z-[9999] transition-opacity duration-500">
        <div class="w-16 h-16 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-cyan-400 font-semibold tracking-wider">Loading Application...</p>
    </div>

    <main class="w-full mx-auto pt-4 px-2 sm:px-4 pb-12 md:max-w-4xl lg:max-w-[1200px] xl:max-w-[1400px]">
        <section class="w-full mb-6 flex justify-center">
            
            <div id="video-wrapper" class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800 flex items-center justify-center group tv:w-[90%]">
                
                <video id="main-video-player" class="absolute inset-0 w-full h-full object-contain bg-black transition-all duration-300" playsinline></video>
                
                <div id="channel-popup" class="absolute top-6 left-1/2 -translate-x-1/2 glass-panel px-6 py-2 rounded-full text-cyan-400 font-bold text-lg shadow-xl opacity-0 translate-y-[-20px] transition-all duration-300 z-50 pointer-events-none">
                    <span id="popup-text">Channel Name</span>
                </div>

                <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 bg-black z-10 pointer-events-none">
                    <i class="fa-solid fa-play fa-4x opacity-50 mb-4 text-cyan-400 drop-shadow-[0_0_15px_rgba(6,182,212,0.5)]"></i>
                    <p class="text-sm font-semibold tracking-wide">Select a channel to play</p>
                </div>

                <div id="master-controls" class="absolute inset-0 z-20 opacity-0 transition-opacity duration-500">
                    
                    <div class="absolute left-4 top-1/2 -translate-y-1/2 flex flex-col space-y-4">
                        <button onclick="togglePanel('brightness-panel')" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-white hover:text-cyan-400 hover:scale-110 transition-all shadow-lg">
                            <i class="fa-solid fa-sun"></i>
                        </button>
                        <div id="brightness-panel" class="absolute left-14 top-0 hidden glass-panel p-4 rounded-2xl flex flex-col items-center space-y-3 origin-left animate-fade-in-left">
                            <i class="fa-solid fa-sun text-cyan-400 text-sm"></i>
                            <input type="range" id="brightness-slider" min="20" max="150" value="100" class="vertical-slider">
                            <i class="fa-regular fa-sun text-gray-400 text-xs"></i>
                        </div>
                    </div>

                    <div class="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col space-y-4">
                        <button id="next-channel-btn" class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-white hover:bg-cyan-500 hover:text-white hover:scale-110 active:scale-95 transition-all shadow-lg text-lg">
                            <i class="fa-solid fa-chevron-up"></i>
                        </button>
                        <button id="prev-channel-btn" class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-white hover:bg-cyan-500 hover:text-white hover:scale-110 active:scale-95 transition-all shadow-lg text-lg">
                            <i class="fa-solid fa-chevron-down"></i>
                        </button>
                    </div>

                    <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black/90 via-black/40 to-transparent p-4 flex justify-between items-end">
                        
                        <div class="flex items-center text-red-500 font-bold text-sm tracking-wider glass-panel px-3 py-1 rounded-lg">
                            <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse mr-2 shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span> LIVE
                        </div>
                        
                        <div class="flex items-center space-x-4 relative">
                            
                            <div id="quality-panel" class="absolute bottom-12 right-24 hidden glass-panel rounded-xl overflow-hidden w-32 flex flex-col origin-bottom">
                                </div>
                            <button onclick="togglePanel('quality-panel')" id="quality-btn" class="glass-panel hover:text-cyan-400 transition-colors font-bold text-xs rounded-lg px-3 py-1.5 hidden">Auto</button>
                            
                            <div id="volume-panel" class="absolute bottom-12 right-12 hidden glass-panel px-4 py-3 rounded-2xl flex items-center space-x-3 origin-bottom">
                                <i class="fa-solid fa-volume-low text-xs text-gray-400"></i>
                                <input type="range" id="volume-slider" min="0" max="100" value="100" class="w-24">
                                <i class="fa-solid fa-volume-high text-xs text-cyan-400"></i>
                            </div>
                            <button onclick="togglePanel('volume-panel')" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-white hover:text-cyan-400 hover:scale-110 transition-all">
                                <i id="vol-icon" class="fa-solid fa-volume-high"></i>
                            </button>

                            <button id="fullscreen-btn" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-white hover:text-cyan-400 hover:scale-110 transition-all text-lg">
                                <i class="fa-solid fa-expand"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="w-full mb-4">
            <div class="relative w-full sm:w-1/2 lg:w-1/3 mx-auto">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="channel-search" placeholder="Search channels..." class="w-full bg-[#1e293b] border border-gray-700 text-white text-sm rounded-full focus:ring-cyan-500 focus:border-cyan-500 block pl-10 p-2.5 transition-colors shadow-inner outline-none">
            </div>
        </section>

        <section class="w-full mb-6">
            <div class="flex overflow-x-auto space-x-3 no-scrollbar py-2 px-1" id="category-tabs"></div>
        </section>

        <section class="w-full">
            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3 sm:gap-4" id="channel-grid"></div>
        </section>
    </main>

    <script>
        const DOM = {
            loader: document.getElementById('loading-screen'),
            videoWrapper: document.getElementById('video-wrapper'),
            video: document.getElementById('main-video-player'),
            placeholder: document.getElementById('player-placeholder'),
            masterControls: document.getElementById('master-controls'),
            panels: ['brightness-panel', 'volume-panel', 'quality-panel'],
            sliders: {
                brightness: document.getElementById('brightness-slider'),
                volume: document.getElementById('volume-slider')
            },
            channelPopup: document.getElementById('channel-popup'),
            popupText: document.getElementById('popup-text'),
            qualityPanel: document.getElementById('quality-panel'),
            qualityBtn: document.getElementById('quality-btn'),
            volIcon: document.getElementById('vol-icon'),
            tabsContainer: document.getElementById('category-tabs'),
            gridContainer: document.getElementById('channel-grid'),
            searchInput: document.getElementById('channel-search') // New Search DOM
        };

        let currentChannelsData = [];
        let currentPlayingIndex = -1;
        let hlsPlayer = null;
        let controlsTimer;
        let popupTimer;

        // --- 1. Initialization ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                DOM.loader.style.opacity = "0";
                setTimeout(() => DOM.loader.classList.add('hidden'), 500);
            }, 800);
        });

        // --- 2. Smart Controls Logic (Auto Hide & Exclusive Panels) ---
        function resetControlsTimer() {
            DOM.masterControls.style.opacity = '1';
            DOM.videoWrapper.style.cursor = 'default';
            clearTimeout(controlsTimer);
            
            controlsTimer = setTimeout(() => {
                if(!DOM.video.paused) {
                    DOM.masterControls.style.opacity = '0';
                    DOM.videoWrapper.style.cursor = 'none';
                    closeAllPanels(); // Auto close floating panels when controls hide
                }
            }, 3000);
        }

        ['mousemove', 'touchstart', 'click'].forEach(evt => {
            DOM.videoWrapper.addEventListener(evt, resetControlsTimer);
        });

        function closeAllPanels() {
            DOM.panels.forEach(id => document.getElementById(id).classList.add('hidden'));
        }

        window.togglePanel = function(panelId) {
            const panel = document.getElementById(panelId);
            const isHidden = panel.classList.contains('hidden');
            closeAllPanels(); 
            if (isHidden) panel.classList.remove('hidden');
            resetControlsTimer();
        };

        DOM.panels.forEach(id => {
            document.getElementById(id).addEventListener('click', e => e.stopPropagation());
        });

        // --- 3. Hardware Accelerated Sliders ---
        DOM.sliders.brightness.addEventListener('input', (e) => {
            DOM.video.style.filter = `brightness(${e.target.value}%)`;
            resetControlsTimer();
        });

        DOM.sliders.volume.addEventListener('input', (e) => {
            const vol = e.target.value / 100;
            DOM.video.volume = vol;
            if(vol === 0) DOM.volIcon.className = 'fa-solid fa-volume-xmark text-red-400';
            else if(vol < 0.5) DOM.volIcon.className = 'fa-solid fa-volume-low text-cyan-400';
            else DOM.volIcon.className = 'fa-solid fa-volume-high text-cyan-400';
            resetControlsTimer();
        });

        // --- 4. Channel Navigation & Popup ---
        function showChannelPopup(name) {
            DOM.popupText.innerText = name;
            DOM.channelPopup.classList.remove('opacity-0', 'translate-y-[-20px]');
            DOM.channelPopup.classList.add('opacity-100', 'translate-y-0');
            
            clearTimeout(popupTimer);
            popupTimer = setTimeout(() => {
                DOM.channelPopup.classList.remove('opacity-100', 'translate-y-0');
                DOM.channelPopup.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 2000);
        }

        document.getElementById('next-channel-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentChannelsData.length > 0) playChannel((currentPlayingIndex + 1) % currentChannelsData.length);
        });

        document.getElementById('prev-channel-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentChannelsData.length > 0) playChannel((currentPlayingIndex - 1 + currentChannelsData.length) % currentChannelsData.length);
        });

        // --- 5. HD Quality Selector ---
        function updateQualityMenu(levels) {
            DOM.qualityPanel.innerHTML = '';
            if (!levels || levels.length === 0) {
                DOM.qualityBtn.classList.add('hidden');
                return;
            }
            
            DOM.qualityBtn.classList.remove('hidden');
            DOM.qualityBtn.innerText = 'Auto';

            createQualityOption('Auto', -1, true);

            const sortedLevels = levels.slice().reverse();
            sortedLevels.forEach((level, index) => {
                const originalIndex = levels.length - 1 - index;
                let label = level.height ? level.height + 'p' : 'HQ';
                if(level.height === 1080) label = '1080p FHD';
                if(level.height === 720) label = '720p HD';
                if(level.height === 480) label = '480p SD';
                
                createQualityOption(label, originalIndex, false);
            });
        }

        function createQualityOption(label, levelIndex, isAuto) {
            const btn = document.createElement('button');
            btn.className = `block w-full px-4 py-2 text-sm text-left hover:bg-cyan-600 hover:text-white transition-colors border-b border-gray-700/50 last:border-0 ${isAuto ? 'font-bold text-cyan-400' : 'text-gray-300'}`;
            btn.innerText = label;
            btn.onclick = (e) => {
                e.stopPropagation();
                hlsPlayer.currentLevel = levelIndex;
                DOM.qualityBtn.innerText = label.split(' ')[0]; 
                
                Array.from(DOM.qualityPanel.children).forEach(child => child.classList.remove('text-cyan-400', 'font-bold'));
                btn.classList.add('text-cyan-400', 'font-bold');
                
                closeAllPanels();
            };
            DOM.qualityPanel.appendChild(btn);
        }

        // --- 6. Fullscreen Logic ---
        document.getElementById('fullscreen-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                if (DOM.videoWrapper.requestFullscreen) DOM.videoWrapper.requestFullscreen();
                document.getElementById('fullscreen-btn').innerHTML = '<i class="fa-solid fa-compress"></i>';
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                document.getElementById('fullscreen-btn').innerHTML = '<i class="fa-solid fa-expand"></i>';
            }
            closeAllPanels();
        });

        // --- 7. Data Loading, Search & Player Logic ---
        
        // Buno All added to the top
        const categoryFiles = [
            { name: "Buno All", file: "./channels/bunoall.json" },
            { name: "Bangla News", file: "./channels/bangla-news.json" },
            { name: "Bangla", file: "./channels/bangla.json" },
            { name: "Live TV", file: "./channels/live-tv.json" },
            { name: "India", file: "./channels/india.json" },
            { name: "Movies", file: "./channels/movies.json" },
            { name: "Kids", file: "./channels/kids.json" },
            { name: "Music", file: "./channels/music.json" },
            { name: "Educational", file: "./channels/educational.json" },
            { name: "International", file: "./channels/international.json" },
            { name: "Pakistan", file: "./channels/pakistan.json" },
            { name: "Religious", file: "./channels/religious.json" }
        ];

        function initTabs() {
            categoryFiles.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.className = index === 0 
                    ? "px-5 py-2 rounded-full text-sm font-bold bg-cyan-500 text-white flex-shrink-0 shadow-lg shadow-cyan-500/30"
                    : "px-5 py-2 rounded-full text-sm font-bold bg-[#1e293b] text-gray-300 flex-shrink-0 hover:bg-[#334155] transition-colors";
                btn.textContent = cat.name;
                btn.onclick = () => {
                    Array.from(DOM.tabsContainer.children).forEach(b => b.className = "px-5 py-2 rounded-full text-sm font-bold bg-[#1e293b] text-gray-300 flex-shrink-0 hover:bg-[#334155] transition-colors");
                    btn.className = "px-5 py-2 rounded-full text-sm font-bold bg-cyan-500 text-white flex-shrink-0 shadow-lg shadow-cyan-500/30";
                    
                    DOM.searchInput.value = ''; // Reset search on tab change
                    loadChannelData(cat.file);
                };
                DOM.tabsContainer.appendChild(btn);
            });
            loadChannelData(categoryFiles[0].file);
        }

        async function loadChannelData(fileName) {
            DOM.gridContainer.innerHTML = '';
            try {
                const response = await fetch(fileName);
                const data = await response.json();
                currentChannelsData = data;
                renderChannels(currentChannelsData);
            } catch (error) {
                console.error("Error loading file:", error);
            }
        }

        // Search Functionality
        DOM.searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredChannels = currentChannelsData.filter(channel => 
                channel.name.toLowerCase().includes(searchTerm)
            );
            renderChannels(filteredChannels, true); // true indicates it's a filtered list
        });

        function playChannel(index, dataArray = currentChannelsData) {
            if (index < 0 || index >= dataArray.length) return;
            
            // Sync the playing index with the main array if we clicked from a search result
            const channel = dataArray[index];
            currentPlayingIndex = currentChannelsData.findIndex(c => c.url === channel.url);
            
            const cleanName = channel.name.replace(/^(BD\s*\|\s*|IN\s*\|\s*|EN\s*\|\s*|OTHER\s*\|\s*|TR\s*\|\s*|ENT\s*\|\s*)/i, '').trim();
            
            DOM.placeholder.classList.add('hidden');
            showChannelPopup(cleanName);
            resetControlsTimer();
            closeAllPanels();

            if (Hls.isSupported()) {
                if (hlsPlayer) hlsPlayer.destroy();
                
                // --- OPTIMIZED HLS SETTINGS FOR FAST LOADING & REDUCED BUFFERING ---
                hlsPlayer = new Hls({ 
                    capLevelToPlayerSize: true,
                    enableWorker: true,
                    lowLatencyMode: true, // Enables low latency HLS parsing
                    maxBufferLength: 8,   // Maximum buffer kept in memory (seconds)
                    maxMaxBufferLength: 15, // Absolute max buffer limit
                    liveSyncDurationCount: 2, // Sync closer to the live edge
                    liveMaxLatencyDurationCount: 5,
                    manifestLoadingTimeOut: 10000,
                    manifestLoadingMaxRetry: 3
                }); 
                
                hlsPlayer.loadSource(channel.url);
                hlsPlayer.attachMedia(DOM.video);
                
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    DOM.video.play();
                    updateQualityMenu(data.levels);
                });
            } else if (DOM.video.canPlayType('application/vnd.apple.mpegurl')) {
                DOM.video.src = channel.url;
                DOM.video.play();
                DOM.qualityBtn.classList.add('hidden'); 
            }
        }

        function renderChannels(channels, isFiltered = false) {
            DOM.gridContainer.innerHTML = '';
            
            if (channels.length === 0) {
                DOM.gridContainer.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">No channels found</p>';
                return;
            }

            channels.forEach((channel, index) => {
                const cleanName = channel.name.replace(/^(BD\s*\|\s*|IN\s*\|\s*|EN\s*\|\s*|OTHER\s*\|\s*|TR\s*\|\s*|ENT\s*\|\s*)/i, '').trim();
                const card = document.createElement('button');
                card.className = "aspect-square bg-gray-900/50 backdrop-blur rounded-2xl flex flex-col items-center justify-center p-3 hover:-translate-y-2 hover:shadow-[0_10px_20px_rgba(6,182,212,0.2)] transition-all duration-300 group border border-white/5 focus:outline-none focus:ring-2 focus:ring-cyan-500";
                
                const logoHtml = channel.logo 
                    ? `<img src="${channel.logo}" alt="${cleanName}" class="w-14 h-14 object-contain rounded-full bg-white p-1 mb-3 group-hover:scale-110 transition-transform">`
                    : `<div class="w-14 h-14 rounded-full bg-gradient-to-br from-gray-700 to-gray-800 flex items-center justify-center text-cyan-400 font-bold text-xl mb-3">${cleanName.charAt(0)}</div>`;

                card.innerHTML = `${logoHtml}<span class="text-xs font-semibold text-gray-300 text-center truncate w-full group-hover:text-cyan-400 transition-colors">${cleanName}</span>`;

                card.onclick = () => {
                    playChannel(index, channels);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                DOM.gridContainer.appendChild(card);
            });
        }

        initTabs();
    </script>
</body>
</html>
