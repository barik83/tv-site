<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultima IPTV Pro - Category Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* আপনার আগের CSS গুলো এখানে রাখুন (সংক্ষিপ্ততার জন্য বাদ দিলাম) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(20, 24, 33, 0.95); border: 1px solid rgba(255, 255, 255, 0.05); }
        @supports (backdrop-filter: blur(10px)) { .glass-panel { background: rgba(15, 15, 15, 0.80); backdrop-filter: blur(10px); } }
        .channel-card-peek:hover { border-color: #00E676; box-shadow: 0 0 15px rgba(0,230,118,0.25); transform: translateY(-5px); }
        #channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; }
        @media (max-width: 640px) { #channel-grid { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; } }
        .channel-card-peek { padding: 0.5rem; aspect-ratio: 1/1; background: rgba(255,255,255,0.05); border-radius: 1rem; transition: 0.2s; }
        .channel-card-peek img { width: 2.5rem; height: 2.5rem; object-fit: contain; border-radius: 50%; background: white; padding: 2px; }
        .channel-card-peek span { font-size: 0.65rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .category-tab { padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.7rem; font-weight: bold; background: #1e293b; color: #94a3b8; white-space: nowrap; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .category-tab.active { background: #00E676; color: #000; border-color: #00E676; }
        .category-tab:hover { background: #334155; color: #fff; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans">

    <!-- লোডার -->
    <div id="loading-screen" class="fixed inset-0 bg-gray-950 flex flex-col items-center justify-center z-[9999] transition-opacity duration-500">
        <div class="w-16 h-16 border-4 border-[#00E676] border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-[#00E676] font-semibold tracking-wider">Loading Channels...</p>
    </div>

    <main class="w-full max-w-7xl mx-auto px-3 py-4">
        <!-- হেডার -->
        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-tv text-[#00E676] text-2xl"></i>
                <span class="font-bold text-white text-lg">Ultima IPTV</span>
                <span class="text-xs text-gray-500 bg-gray-800 px-2 py-0.5 rounded-full" id="channel-count">0 channels</span>
            </div>
            <div class="flex items-center gap-3 text-xs text-gray-400">
                <span id="live-time" class="font-mono text-white bg-black/40 px-3 py-1 rounded-md">00:00:00</span>
                <span id="live-date" class="bg-black/40 px-3 py-1 rounded-md">01 Jan 2026</span>
            </div>
        </div>

        <!-- প্লেয়ার -->
        <section class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800 mb-4">
            <video id="main-video-player" class="absolute inset-0 w-full h-full object-contain" playsinline preload="metadata" muted></video>
            <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 bg-black/80">
                <i class="fa-solid fa-satellite-dish fa-4x text-[#00E676] mb-3 animate-pulse"></i>
                <p class="text-sm font-semibold text-gray-300">Select a channel to play</p>
            </div>
            <div id="stream-loading" class="absolute inset-0 bg-black/80 hidden flex-col items-center justify-center">
                <div class="w-10 h-10 border-4 border-[#00E676] border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs text-[#00E676] mt-2">Loading...</p>
            </div>
            <!-- মিনি কন্ট্রোল (অপশনাল) -->
            <div class="absolute bottom-4 left-4 right-4 flex justify-between items-center opacity-0 hover:opacity-100 transition-opacity">
                <button id="play-pause-btn" class="bg-[#00E676] text-black w-10 h-10 rounded-full flex items-center justify-center"><i class="fa-solid fa-play ml-0.5"></i></button>
                <div class="flex gap-2">
                    <button id="prev-btn" class="bg-black/50 text-white w-8 h-8 rounded-full"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="next-btn" class="bg-black/50 text-white w-8 h-8 rounded-full"><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>
        </section>

        <!-- সার্চ -->
        <div class="relative w-full sm:w-1/2 mx-auto mb-4">
            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
            <input type="text" id="search-input" placeholder="Search channels by name..." class="w-full bg-gray-800 border border-gray-700 text-white text-sm rounded-full pl-9 pr-4 py-2 outline-none focus:border-[#00E676] transition">
        </div>

        <!-- ক্যাটাগরি ট্যাব -->
        <div id="category-tabs" class="flex overflow-x-auto gap-1.5 pb-2 no-scrollbar mb-4">
            <!-- ডায়নামিকভাবে জাভাস্ক্রিপ্ট দিয়ে তৈরি হবে -->
        </div>

        <!-- চ্যানেল গ্রিড -->
        <div id="channel-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2"></div>
    </main>

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
    // ==============================
    //  কোর জাভাস্ক্রিপ্ট (ক্যাটাগরি সহ)
    // ==============================
    (function() {
        'use strict';

        // DOM
        const $ = (id) => document.getElementById(id);
        const video = $('main-video-player');
        const grid = $('channel-grid');
        const searchInput = $('search-input');
        const tabsContainer = $('category-tabs');
        const loadingScreen = $('loading-screen');
        const streamLoading = $('stream-loading');
        const placeholder = $('player-placeholder');
        const playPauseBtn = $('play-pause-btn');
        const prevBtn = $('prev-btn');
        const nextBtn = $('next-btn');
        const channelCount = $('channel-count');

        // স্টেট
        let allChannels = [];
        let currentChannels = [];
        let currentPlayingIndex = -1;
        let hls = null;
        let categories = [];
        let currentCategory = 'All';

        // ===== M3U পার্সার (ক্যাটাগরি সহ) =====
        function parseM3U(text) {
            const lines = text.split('\n');
            const channels = [];
            let current = null;
            const categorySet = new Set();

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,([^,]+)$/);
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    const idMatch = line.match(/tvg-id="([^"]+)"/);
                    const group = groupMatch ? groupMatch[1].trim() : 'General';
                    categorySet.add(group);
                    current = {
                        name: nameMatch ? nameMatch[1].trim() : 'Unknown',
                        logo: logoMatch ? logoMatch[1] : '',
                        group: group,
                        id: idMatch ? idMatch[1] : '',
                        url: ''
                    };
                } else if (line.startsWith('http') && current) {
                    current.url = line;
                    // ডুপ্লিকেট চেক
                    if (!channels.some(c => c.url === current.url)) {
                        channels.push(current);
                    }
                    current = null;
                }
            }

            categories = ['All', ...Array.from(categorySet).sort()];
            return channels;
        }

        // ===== ক্যাটাগরি ট্যাব রেন্ডার =====
        function renderTabs() {
            tabsContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `category-tab ${cat === currentCategory ? 'active' : ''}`;
                btn.textContent = cat === 'All' ? '🌟 All' : cat;
                btn.dataset.category = cat;
                btn.onclick = () => {
                    currentCategory = cat;
                    renderTabs();
                    filterAndRender(cat);
                };
                tabsContainer.appendChild(btn);
            });
        }

        // ===== ফিল্টার ও রেন্ডার =====
        function filterAndRender(category, searchTerm = '') {
            let filtered = allChannels;
            if (category && category !== 'All') {
                filtered = filtered.filter(ch => ch.group === category);
            }
            if (searchTerm) {
                const q = searchTerm.toLowerCase();
                filtered = filtered.filter(ch => ch.name.toLowerCase().includes(q));
            }
            currentChannels = filtered;
            renderChannels(filtered);
            channelCount.textContent = filtered.length + ' channels';
        }

        // ===== চ্যানেল রেন্ডার =====
        function renderChannels(channels) {
            grid.innerHTML = '';
            if (!channels || channels.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">No channels found</div>';
                return;
            }

            const fragment = document.createDocumentFragment();
            channels.forEach((ch, idx) => {
                const card = document.createElement('button');
                card.className = 'channel-card-peek flex flex-col items-center justify-center gap-1';
                const name = ch.name.replace(/^(BD\s*\|\s*|IN\s*\|\s*|EN\s*\|\s*|OTHER\s*\|\s*|TR\s*\|\s*|ENT\s*\|\s*)/i, '').trim();
                const logoHtml = ch.logo
                    ? `<img loading="lazy" onerror="this.style.display='none'" src="${ch.logo}" alt="">`
                    : `<div class="w-10 h-10 rounded-full bg-gradient-to-br from-gray-700 to-gray-900 flex items-center justify-center text-[#00E676] font-bold text-lg">${name.charAt(0).toUpperCase()}</div>`;
                card.innerHTML = `
                    ${logoHtml}
                    <span class="text-center text-[11px] font-medium text-gray-300 group-hover:text-[#00E676] transition">${name}</span>
                    <span class="text-[8px] text-gray-600">${ch.group}</span>
                `;
                card.onclick = () => playChannel(idx);
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);
        }

        // ===== প্লে চ্যানেল =====
        function playChannel(index) {
            if (index < 0 || index >= currentChannels.length) return;
            const ch = currentChannels[index];
            currentPlayingIndex = index;
            placeholder.classList.add('hidden');
            streamLoading.classList.remove('hidden');

            if (hls) { hls.destroy(); hls = null; }

            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    maxBufferLength: 30,
                    liveSyncDuration: 4,
                    manifestLoadingMaxRetry: 3,
                    fragLoadingMaxRetry: 3,
                });
                hls.loadSource(ch.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.volume = 0.8;
                    video.play().catch(() => { video.muted = true; video.play(); });
                    streamLoading.classList.add('hidden');
                    playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                });
                hls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                        else { hls.destroy(); streamLoading.classList.add('hidden'); }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.play();
                streamLoading.classList.add('hidden');
                playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                streamLoading.classList.add('hidden');
                alert('HLS not supported in this browser');
            }
        }

        // ===== লোড M3U =====
        async function loadM3U(url) {
            try {
                const resp = await fetch(url, { mode: 'cors' });
                if (!resp.ok) throw new Error('Network error');
                const text = await resp.text();
                allChannels = parseM3U(text);
                if (allChannels.length === 0) throw new Error('No channels found');
                currentCategory = 'All';
                renderTabs();
                filterAndRender('All');
                loadingScreen.style.opacity = '0';
                setTimeout(() => loadingScreen.classList.add('hidden'), 500);
            } catch (err) {
                grid.innerHTML = `<div class="col-span-full text-center text-red-400 py-8">Failed to load playlist: ${err.message}</div>`;
                loadingScreen.style.opacity = '0';
                setTimeout(() => loadingScreen.classList.add('hidden'), 500);
            }
        }

        // ===== ইভেন্ট লিসেনার =====
        playPauseBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                video.pause();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentChannels.length === 0) return;
            const idx = (currentPlayingIndex - 1 + currentChannels.length) % currentChannels.length;
            playChannel(idx);
        });

        nextBtn.addEventListener('click', () => {
            if (currentChannels.length === 0) return;
            const idx = (currentPlayingIndex + 1) % currentChannels.length;
            playChannel(idx);
        });

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.trim();
            filterAndRender(currentCategory, term);
        });

        // ===== ক্লক =====
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('live-time').textContent = `${String(h).padStart(2, '0')}:${m}:${s} ${ampm}`;
            document.getElementById('live-date').textContent = now.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ===== স্টার্ট =====
        loadM3U('https://iptv-org.github.io/iptv/index.m3u');

        // এক্সপোজ
        window.playChannel = playChannel;
        window.loadM3U = loadM3U;
    })();
    </script>
</body>
</html>
