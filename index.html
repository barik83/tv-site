<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV OTT App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Hide scrollbar for the horizontal navigation but keep it functional */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .channel-logo-img {
            object-fit: contain;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans selection:bg-cyan-500 selection:text-white">

    <main class="w-full max-w-4xl mx-auto pt-4 px-3 sm:px-6 pb-12">

        <section class="w-full mb-4">
            <div class="relative w-full pb-[56.25%] bg-black rounded-lg overflow-hidden shadow-2xl border border-gray-800 group cursor-pointer">
                <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 transition-transform transform group-hover:scale-105">
                    <i class="fa-solid fa-play fa-4x opacity-50 mb-4"></i>
                    <p id="player-status" class="text-sm font-semibold tracking-wide">Select a channel to play</p>
                </div>
                
                <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black/95 via-black/70 to-transparent p-3 sm:p-4 flex justify-between items-center opacity-90 group-hover:opacity-100 transition-opacity">
                    <div class="flex items-center">
                        <div class="flex items-center text-red-600 font-bold text-xs sm:text-sm tracking-wider bg-black/40 px-2 py-1 rounded">
                            <span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-red-600 animate-pulse mr-1.5 sm:mr-2"></span> LIVE
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-3 sm:space-x-5 text-gray-300 text-sm sm:text-base">
                        <button class="hover:text-white transition-colors" title="Settings"><i class="fa-solid fa-gear"></i></button>
                        <button class="hover:text-white transition-colors font-bold text-[10px] sm:text-xs border border-gray-400 hover:border-white rounded px-1.5 py-0.5" title="Quality">HD</button>
                        <button class="hover:text-white transition-colors" title="Volume"><i class="fa-solid fa-volume-high"></i></button>
                        <button class="hover:text-white transition-colors" title="Closed Captions"><i class="fa-solid fa-closed-captioning"></i></button>
                        <button class="hover:text-white transition-colors" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
                    </div>
                </div>
            </div>
            
            <div class="mt-3 text-center text-cyan-400 text-xs sm:text-sm font-semibold tracking-wide">
                INTERNATIONAL Channel May Buffer
            </div>
        </section>

        <section class="w-full mb-6">
            <div class="flex overflow-x-auto space-x-2.5 no-scrollbar py-2" id="category-tabs">
                </div>
        </section>

        <div id="status-message" class="text-center text-gray-400 text-sm hidden my-8">
            <i class="fa-solid fa-circle-notch fa-spin text-cyan-400 text-2xl mb-2"></i>
            <p>Loading channels...</p>
        </div>

        <section class="w-full">
            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 sm:gap-4" id="channel-grid">
                </div>
        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Mapping categories to their respective JSON files
            const categoryFiles = [
                { name: "Bangla", file: "bangla.json" },
                { name: "Bangla News", file: "bangla-news.json" },
                { name: "Live TV", file: "live-tv.json" },
                { name: "India", file: "india.json" },
                { name: "Movies", file: "movies.json" },
                { name: "Kids", file: "kids.json" },
                { name: "Music", file: "music.json" },
                { name: "Int. News", file: "international-news.json" },
                { name: "International", file: "international.json" },
                { name: "Educational", file: "educational.json" }
            ];

            const tabsContainer = document.getElementById('category-tabs');
            const gridContainer = document.getElementById('channel-grid');
            const statusMessage = document.getElementById('status-message');
            const playerStatus = document.getElementById('player-status');

            // 1. Initialize Navigation Tabs
            function initTabs() {
                categoryFiles.forEach((cat, index) => {
                    const btn = document.createElement('button');
                    // Set the first tab as active by default
                    if(index === 0) {
                        btn.className = "tab-btn px-5 py-2 rounded-full text-sm font-bold bg-white text-gray-900 flex-shrink-0 transition-colors shadow-sm";
                    } else {
                        btn.className = "tab-btn px-5 py-2 rounded-full text-sm font-bold bg-gray-800 text-white flex-shrink-0 transition-colors hover:bg-gray-700";
                    }
                    btn.textContent = cat.name;
                    btn.dataset.file = cat.file;
                    
                    btn.addEventListener('click', () => {
                        // Reset tab styles
                        document.querySelectorAll('.tab-btn').forEach(b => {
                            b.className = "tab-btn px-5 py-2 rounded-full text-sm font-bold bg-gray-800 text-white flex-shrink-0 transition-colors hover:bg-gray-700";
                        });
                        // Set active style
                        btn.className = "tab-btn px-5 py-2 rounded-full text-sm font-bold bg-white text-gray-900 flex-shrink-0 transition-colors shadow-sm";
                        
                        // Load corresponding data
                        loadChannelData(cat.file);
                    });

                    tabsContainer.appendChild(btn);
                });
                
                // Load the first category initially
                loadChannelData(categoryFiles[0].file);
            }

            // 2. Fetch and Load Channel Data from JSON
            async function loadChannelData(fileName) {
                gridContainer.innerHTML = ''; // Clear grid
                statusMessage.classList.remove('hidden'); // Show loading spinner
                statusMessage.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-cyan-400 text-2xl mb-2"></i><p>Loading channels...</p>`;

                try {
                    const response = await fetch(fileName);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const data = await response.json();
                    statusMessage.classList.add('hidden'); // Hide loading
                    
                    renderChannels(data);

                } catch (error) {
                    console.error("Error fetching data:", error);
                    statusMessage.innerHTML = `
                        <div class="bg-red-900/30 border border-red-800 text-red-400 p-4 rounded-lg">
                            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                            <p class="font-bold">Failed to load <code>${fileName}</code></p>
                            <p class="text-xs mt-1 text-gray-300">Are you running this via a Local Web Server (like VS Code Live Server)? File fetching won't work simply by double-clicking the HTML file due to browser CORS policies.</p>
                        </div>
                    `;
                }
            }

            // 3. Render Channel Cards
            function renderChannels(channels) {
                channels.forEach(channel => {
                    const card = document.createElement('button');
                    card.className = "channel-card aspect-square bg-white rounded-xl flex flex-col items-center justify-center p-2 hover:-translate-y-1 hover:shadow-[0_4px_15px_rgba(6,182,212,0.3)] transition-all duration-200 group focus:outline-none focus:ring-2 focus:ring-cyan-400";
                    
                    // Handle missing/broken logos gracefully
                    let logoHtml = '';
                    if (channel.logo && channel.logo.trim() !== "") {
                        logoHtml = `<img src="${channel.logo}" alt="${channel.name}" class="channel-logo-img bg-gray-50" onerror="this.onerror=null; this.outerHTML='<div class=\\'w-full h-full rounded-full bg-gray-200 flex items-center justify-center text-gray-500 text-xl font-bold\\'>${channel.name.charAt(0)}</div>'">`;
                    } else {
                        // Fallback text logo if no image URL is provided
                        logoHtml = `<div class="w-full h-full rounded-full bg-cyan-50 border border-cyan-100 flex items-center justify-center text-cyan-600 font-black text-2xl uppercase">${channel.name.charAt(0)}</div>`;
                    }

                    // Extract a clean name (e.g., remove "BD | " or "EN | " prefixes for the UI display if you want, or just display raw)
                    const displayName = channel.name;

                    card.innerHTML = `
                        <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full mb-2 flex items-center justify-center text-gray-700 text-xl group-hover:scale-110 transition-transform relative overflow-hidden">
                            ${logoHtml}
                        </div>
                        <span class="text-xs sm:text-sm font-bold text-gray-800 text-center leading-tight truncate w-full" title="${displayName}">${displayName}</span>
                    `;

                    // Add click event for the player
                    card.addEventListener('click', () => {
                        console.log(`[STREAM CLICKED] Name: ${channel.name} | URL: ${channel.url}`);
                        playerStatus.innerHTML = `Streaming: <span class="text-cyan-400">${channel.name}</span>`;
                        playerStatus.parentElement.classList.remove('text-gray-500');
                        playerStatus.parentElement.classList.add('text-white');
                        
                        // Click animation
                        card.classList.add('scale-95', 'opacity-80');
                        setTimeout(() => card.classList.remove('scale-95', 'opacity-80'), 150);
                    });

                    gridContainer.appendChild(card);
                });
            }

            // Start the app
            initTabs();
        });
    </script>
</body>
</html>
