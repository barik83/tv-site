<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultima IPTV Max Pro - OLED & Playlist Parser</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        /* Hidden Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Premium Glassmorphism */
        .glass-panel {
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* OLED True Black Custom Modifiers */
        .oled-mode {
            background-color: #000000 !important;
        }
        .oled-mode .glass-panel {
            background: rgba(0, 0, 0, 0.95) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        
        /* MX Player Custom Range Track Styling */
        input[type=range].mx-seekbar {
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type=range].mx-seekbar::-webkit-slider-runnable-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        input[type=range].mx-seekbar::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #00E676;
            margin-top: -6px;
            box-shadow: 0 0 12px #00E676;
        }

        /* Ambient Backdrop Glow Effect */
        #ambient-glow {
            position: absolute;
            inset: -25px;
            background: rgba(0, 230, 118, 0.12);
            filter: blur(60px);
            z-index: -1;
            border-radius: 2rem;
            pointer-events: none;
            transition: all 1s ease;
        }

        /* Floating Window Mini Sticky Player */
        .sticky-mini-player {
            position: fixed !important;
            bottom: 25px !important;
            right: 25px !important;
            width: 340px !important;
            height: 190px !important;
            z-index: 999 !important;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            border: 2px solid #00E676;
            border-radius: 1rem !important;
            animation: popupSlide 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popupSlide {
            from { transform: scale(0.8) translateY(80px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .neon-glow { text-shadow: 0 0 8px rgba(0, 230, 118, 0.6); }
        #touch-area { touch-action: none; user-select: none; }
        .roller-item { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Hover Channel Peek Border Wave Effect */
        .channel-card-peek:hover {
            border-color: #00E676;
            box-shadow: 0 0 15px rgba(0,230,118,0.25);
            transform: translateY(-5px);
        }
    </style>
</head>
<body id="app-body" class="bg-gray-950 text-white min-h-screen font-sans selection:bg-[#00E676] selection:text-black transition-colors duration-500">

    <div id="loading-screen" class="fixed inset-0 bg-gray-950 flex flex-col items-center justify-center z-[9999] transition-opacity duration-500">
        <div class="w-16 h-16 border-4 border-[#00E676] border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-[#00E676] font-semibold tracking-wider neon-glow animate-pulse">Initializing Ultima IPTV Engine...</p>
    </div>

    <main class="w-full mx-auto pt-4 px-2 sm:px-4 pb-12 md:max-w-4xl lg:max-w-[1200px] xl:max-w-[1400px]">
        
        <section class="w-full mb-6 flex justify-center relative">
            <div id="ambient-glow"></div>

            <div id="video-wrapper" class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-900 flex items-center justify-center group transition-all duration-300">
                
                <video id="main-video-player" class="absolute inset-0 w-full h-full object-contain bg-black transition-all duration-300" playsinline preload="auto"></video>

                <div id="touch-area" class="absolute inset-0 z-10 w-full h-[85%]"></div>

                <div class="absolute top-4 left-4 glass-panel px-4 py-1.5 rounded-xl flex items-center space-x-2 z-40 text-xs font-bold tracking-wide pointer-events-none opacity-80">
                    <span class="text-white">Cepanto</span> <span class="text-gray-600">|</span> <span class="text-[#00E676] neon-glow">my 121</span>
                </div>

                <div id="live-clock-panel" class="absolute top-4 left-1/2 -translate-x-1/2 glass-panel px-4 py-1.5 rounded-xl flex items-center space-x-3 z-40 text-xs font-medium tracking-wide pointer-events-none opacity-0 transition-opacity duration-500 text-gray-300">
                    <span id="live-time" class="font-bold text-white tracking-wider">00:00:00 AM</span>
                    <span class="text-gray-600">|</span> <span id="live-date" class="text-gray-400">01 Jan 2026</span>
                </div>

                <div id="stats-hud" class="absolute top-16 left-4 hidden glass-panel p-3 rounded-xl text-[10px] font-mono text-gray-400 space-y-1 z-50 pointer-events-none w-48 border border-[#00E676]/20">
                    <p class="text-[#00E676] font-bold border-b border-gray-800 pb-1 mb-1">⚡ Stats For Nerds</p>
                    <p>Resolution: <span id="stat-res" class="text-white">0x0</span></p>
                    <p>Frames Per Sec: <span id="stat-fps" class="text-white">0</span></p>
                    <p>Bandwidth: <span id="stat-band" class="text-white">0.00 Mbps</span></p>
                    <p>Buffer Ahead: <span id="stat-buf" class="text-white">0.0s</span></p>
                </div>

                <button id="child-lock-btn" title="Toggle Child Screen Lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white hover:text-red-500 transition-all z-50">
                    <i id="lock-icon" class="fa-solid fa-lock-open text-sm"></i>
                </button>

                <div id="brightness-overlay" class="absolute left-16 top-1/2 -translate-y-1/2 flex flex-col items-center bg-black/60 backdrop-blur-sm p-4 rounded-full opacity-0 transition-opacity duration-200 z-20 pointer-events-none">
                    <span id="brightness-val" class="text-xs font-bold text-white mb-2">30%</span>
                    <div class="w-1 h-20 bg-white/20 rounded-full relative"><div id="brightness-fill" class="absolute bottom-0 w-full bg-[#00E676] rounded-full" style="height: 30%;"></div></div>
                </div>

                <div id="volume-overlay" class="absolute right-24 top-1/2 -translate-y-1/2 flex flex-col items-center bg-black/60 backdrop-blur-sm p-4 rounded-full opacity-0 transition-opacity duration-200 z-20 pointer-events-none">
                    <span id="volume-val" class="text-xs font-bold text-white mb-2">1%</span>
                    <div class="w-1 h-20 bg-white/20 rounded-full relative"><div id="volume-fill" class="absolute bottom-0 w-full bg-[#00E676] rounded-full" style="height: 1%;"></div></div>
                </div>

                <div id="channel-roller" class="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col items-center space-y-4 z-40 bg-black/30 backdrop-blur-md p-2 rounded-2xl border border-white/5 opacity-0 transition-opacity duration-500"></div>

                <div id="channel-popup" class="absolute top-6 left-1/2 -translate-x-1/2 glass-panel px-6 py-2 rounded-full text-[#00E676] font-bold text-lg shadow-xl opacity-0 translate-y-[-20px] transition-all duration-300 z-50 pointer-events-none neon-glow"><span id="popup-text">Channel Sync</span></div>
                <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 bg-black z-10 pointer-events-none"><i class="fa-solid fa-satellite-dish fa-4x text-[#00E676] mb-3 animate-pulse"></i><p class="text-sm font-semibold text-gray-300">Select an IPTV Stream to Broadcast</p></div>

                <div id="master-controls" class="absolute inset-0 z-30 opacity-0 transition-opacity duration-500 bg-gradient-to-t from-black/90 via-transparent to-black/40">
                    
                    <div class="absolute top-4 right-4 flex items-center space-x-2">
                        <button id="nerd-btn" title="Stats For Nerds" class="w-9 h-9 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white hover:text-[#00E676] transition-all"><i class="fa-solid fa-chart-line text-xs"></i></button>
                        <button onclick="togglePanel('advanced-settings-panel')" title="Advanced HUD Settings" class="w-9 h-9 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white hover:text-[#00E676] transition-all"><i class="fa-solid fa-gear"></i></button>
                    </div>

                    <div id="advanced-settings-panel" class="absolute top-16 right-4 hidden glass-panel rounded-2xl w-72 p-4 shadow-2xl z-50 animate-fade-in">
                        <div class="grid grid-cols-4 gap-2 mb-4 border-b border-gray-800 pb-4 text-center">
                            <button id="fav-toggle-btn" class="flex flex-col items-center hover:text-red-500 transition-colors"><i class="fa-solid fa-heart text-base mb-1"></i><span class="text-[9px] font-bold">Favorite</span></button>
                            <button id="timer-menu-btn" class="flex flex-col items-center hover:text-blue-400 transition-colors"><i class="fa-solid fa-clock text-base mb-1"></i><span id="timer-label" class="text-[9px] font-bold">Sleep Off</span></button>
                            <button id="oled-theme-btn" class="flex flex-col items-center hover:text-purple-400 transition-colors"><i class="fa-solid fa-circle text-base mb-1"></i><span id="oled-label" class="text-[9px] font-bold">OLED Off</span></button>
                            <button onclick="cycleAspectRatio()" class="flex flex-col items-center hover:text-[#00E676] transition-colors"><i class="fa-solid fa-crop-simple text-base mb-1"></i><span id="aspect-btn-txt" class="text-[9px] font-bold">16:9</span></button>
                        </div>
                        
                        <div class="mt-2 pt-2 border-t border-gray-800">
                            <p class="text-[10px] uppercase font-black text-gray-500 tracking-wider mb-1.5">Load External M3U Playlist</p>
                            <div class="flex space-x-1">
                                <input type="text" id="playlist-url-input" placeholder="Paste .m3u / .m3u8 link..." class="bg-black/50 border border-gray-800 rounded px-2 py-1 text-[10px] text-white flex-grow outline-none focus:border-[#00E676]">
                                <button id="playlist-load-btn" class="bg-[#00E676] text-black px-2 py-1 rounded text-[10px] font-bold hover:bg-[#00c862]">Parse</button>
                            </div>
                        </div>
                    </div>

                    <div id="quality-panel" class="absolute top-36 right-36 hidden glass-panel rounded-xl overflow-hidden w-32 flex flex-col z-50"></div>

                    <div class="absolute bottom-0 left-0 w-full p-4 pt-8 flex flex-col space-y-4">
                        <div class="flex items-center space-x-4 w-full">
                            <span class="text-xs font-semibold text-white tracking-wider">00:00:00</span>
                            <input type="range" id="seek-bar" min="0" max="100" value="100" class="mx-seekbar w-full cursor-not-allowed" disabled>
                            <div class="flex items-center text-[#00E676] font-bold text-xs tracking-wider"><span class="w-2 h-2 rounded-full bg-[#00E676] shadow-[0_0_8px_#00E676] mr-1.5"></span> LIVE</div>
                        </div>

                        <div class="flex items-center justify-between w-full">
                            <div class="flex items-center space-x-4 flex-1">
                                <div class="text-red-500 font-bold text-[10px] bg-red-500/10 px-2 py-1 rounded border border-red-500/30">🔴 LIVE</div>
                                <button id="speed-btn" onclick="cyclePlaybackSpeed()" class="text-xs font-bold text-white bg-white/10 px-2.5 py-1 rounded hover:text-[#00E676]">1.0x</button>
                            </div>

                            <div class="flex items-center justify-center flex-1">
                                <button id="play-pause-btn" class="w-[52px] h-[52px] bg-[#00E676] text-black rounded-full flex items-center justify-center text-xl shadow-[0_0_15px_rgba(0,230,118,0.4)]"><i class="fa-solid fa-pause"></i></button>
                            </div>

                            <div class="flex items-center justify-end space-x-5 flex-1 text-gray-300">
                                <button onclick="cycleAspectRatio()"><i class="fa-solid fa-compress text-lg"></i></button>
                                <button id="pip-btn"><i class="fa-regular fa-window-restore text-lg"></i></button>
                                <button id="rotate-btn"><i class="fa-solid fa-rotate text-lg"></i></button>
                                <button id="fullscreen-btn"><i class="fa-solid fa-expand text-lg"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="w-full mb-4">
            <div id="search-container" class="relative w-full sm:w-1/2 lg:w-1/3 mx-auto px-1">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="channel-search" placeholder="Search entries or speak to AI assistant..." class="w-full bg-[#131926] border border-gray-800 text-white text-sm rounded-full focus:ring-1 focus:ring-[#00E676] focus:border-[#00E676] block pl-10 pr-12 p-2.5 outline-none shadow-2xl transition-colors">
                <button id="voice-assistant-btn" title="AI Speech Navigation" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#00E676] transition-colors"><i id="mic-icon" class="fa-solid fa-microphone"></i></button>
            </div>
        </section>

        <section class="w-full mb-6"><div class="flex overflow-x-auto space-x-3 no-scrollbar py-2 px-1" id="category-tabs"></div></section>
        
        <section class="w-full"><div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3 sm:gap-4" id="channel-grid"></div></section>
    </main>

    <script>
        const DOM = {
            loader: document.getElementById('loading-screen'),
            body: document.getElementById('app-body'),
            videoWrapper: document.getElementById('video-wrapper'),
            video: document.getElementById('main-video-player'),
            placeholder: document.getElementById('player-placeholder'),
            masterControls: document.getElementById('master-controls'),
            panels: ['advanced-settings-panel', 'quality-panel'],
            touchArea: document.getElementById('touch-area'),
            bOverlay: document.getElementById('brightness-overlay'), vOverlay: document.getElementById('volume-overlay'),
            bFill: document.getElementById('brightness-fill'), vFill: document.getElementById('volume-fill'),
            bDot: document.getElementById('brightness-dot'), vDot: document.getElementById('volume-dot'),
            bTxt: document.getElementById('brightness-val'), vTxt: document.getElementById('volume-val'),
            volIcon: document.getElementById('vol-overlay-icon'), roller: document.getElementById('channel-roller'),
            clockPanel: document.getElementById('live-clock-panel'), channelPopup: document.getElementById('channel-popup'),
            popupText: document.getElementById('popup-text'), qualityPanel: document.getElementById('quality-panel'),
            qualityBtn: document.getElementById('quality-btn'), playPauseBtn: document.getElementById('play-pause-btn'),
            speedBtn: document.getElementById('speed-btn'), aspectBtnTxt: document.getElementById('aspect-btn-txt'),
            hudText: document.getElementById('hud-text'), tabsContainer: document.getElementById('category-tabs'),
            gridContainer: document.getElementById('channel-grid'), searchInput: document.getElementById('channel-search'),
            rotateBtn: document.getElementById('rotate-btn'), childLockBtn: document.getElementById('child-lock-btn'),
            nerdBtn: document.getElementById('nerd-btn'), statsHud: document.getElementById('stats-hud'),
            voiceBtn: document.getElementById('voice-assistant-btn'), favToggleBtn: document.getElementById('fav-toggle-btn'),
            timerMenuBtn: document.getElementById('timer-menu-btn'), ambientGlow: document.getElementById('ambient-glow'),
            oledThemeBtn: document.getElementById('oled-theme-btn'),
            playlistUrlInput: document.getElementById('playlist-url-input'),
            playlistLoadBtn: document.getElementById('playlist-load-btn')
        };

        // Complete Local Repositories and History State Stores
        let currentChannelsData = [];
        let favoriteChannels = JSON.parse(localStorage.getItem('iptv_favorites')) || [];
        let historyChannels = JSON.parse(localStorage.getItem('iptv_history')) || [];
        let currentPlayingIndex = -1;
        let hlsPlayer = null;
        let controlsTimer, popupTimer, hideOverlayTimer;
        
        let aspectRatios = ['object-contain', 'object-cover', 'object-fill'];
        let aspectLabels = ['16:9 Screen Fit', 'Zoom Screen Fit', 'Stretch Screen Fit'];
        let currentAspectIdx = 0;
        let playSpeeds = [1.0, 1.25, 1.5, 2.0];
        let currentSpeedIdx = 0;

        // Functional Utility System Flags
        let isChildLocked = false;
        let isNerdHudActive = false;
        let isOledMode = JSON.parse(localStorage.getItem('iptv_oled_mode')) || false;
        let sleepTimerMinutes = 0;
        let sleepTimerInterval = null;
        let streamAutoHealerTicker = null;
        let lastVideoTime = -1;
        let stuckCounter = 0;

        // Default Boot Core Category Configs (Fallbacks)
        const categoryFiles = [
            { name: "Buno All", file: "./channels/bunoall.json" },
            { name: "Bangla News", file: "./channels/bangla-news.json" },
            { name: "Bangla", file: "./channels/bangla.json" },
            { name: "Live TV", file: "./channels/live-tv.json" }
        ];

        window.addEventListener('load', () => {
            initOledTheme();
            setTimeout(() => {
                DOM.loader.style.opacity = "0";
                setTimeout(() => DOM.loader.classList.add('hidden'), 500);
            }, 800);
        });

        // --- 1. STICKY FLOATING WINDOW ENGINE MINI CONTROLLER ---
        const scrollObserver = new IntersectionObserver(([entry]) => {
            if (!entry.isIntersecting && currentPlayingIndex !== -1) {
                DOM.videoWrapper.classList.add('sticky-mini-player');
                DOM.masterControls.classList.add('hidden');
            } else {
                DOM.videoWrapper.classList.remove('sticky-mini-player');
                DOM.masterControls.classList.remove('hidden');
            }
        }, { threshold: 0.1 });
        scrollObserver.observe(document.querySelector('main'));

        function resetControlsTimer() {
            if (isChildLocked) return;
            DOM.masterControls.style.opacity = '1';
            DOM.roller.style.opacity = '1';
            DOM.clockPanel.style.opacity = '1';
            DOM.videoWrapper.style.cursor = 'default';
            clearTimeout(controlsTimer);
            
            controlsTimer = setTimeout(() => {
                if(!DOM.video.paused) {
                    DOM.masterControls.style.opacity = '0';
                    DOM.roller.style.opacity = '0';
                    DOM.clockPanel.style.opacity = '0';
                    DOM.videoWrapper.style.cursor = 'none';
                    closeAllPanels();
                }
            }, 4000);
        }

        DOM.videoWrapper.addEventListener('click', resetControlsTimer);
        DOM.videoWrapper.addEventListener('mousemove', resetControlsTimer);

        function closeAllPanels() {
            DOM.panels.forEach(id => document.getElementById(id).classList.add('hidden'));
        }

        window.togglePanel = function(panelId) {
            if(isChildLocked) return;
            const panel = document.getElementById(panelId);
            const isHidden = panel.classList.contains('hidden');
            closeAllPanels();
            if (isHidden) panel.classList.remove('hidden');
            resetControlsTimer();
        };

        // --- 2. LIVE REALTIME CLOCK MODULE ---
        function runLiveClock() {
            const dateObj = new Date();
            let hh = dateObj.getHours();
            const mm = String(dateObj.getMinutes()).padStart(2, '0');
            const ss = String(dateObj.getSeconds()).padStart(2, '0');
            const cycle = hh >= 12 ? 'PM' : 'AM';
            hh = hh % 12 || 12;
            DOM.clockPanel.children[0].innerText = `${String(hh).padStart(2, '0')}:${mm}:${ss} ${cycle}`;
            DOM.clockPanel.children[2].innerText = dateObj.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
        }
        setInterval(runLiveClock, 1000); runLiveClock();

        // --- 3. OLED TRUE BLACK MODULE ---
        function initOledTheme() {
            if (isOledMode) {
                DOM.body.classList.add('oled-mode');
                document.getElementById('search-container').children[1].classList.replace('bg-[#131926]', 'bg-black');
                document.getElementById('lock-icon').parentElement.classList.replace('bg-black/40', 'bg-black/80');
                document.getElementById('timer-menu-btn').parentElement.parentElement.classList.add('border-white/10');
                document.getElementById('oled-label').innerText = "OLED On";
                DOM.oledThemeBtn.classList.add('text-purple-400');
            } else {
                DOM.body.classList.remove('oled-mode');
                document.getElementById('search-container').children[1].classList.replace('bg-black', 'bg-[#131926]');
                document.getElementById('oled-label').innerText = "OLED Off";
                DOM.oledThemeBtn.classList.remove('text-purple-400');
            }
        }

        DOM.oledThemeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isOledMode = !isOledMode;
            localStorage.setItem('iptv_oled_mode', isOledMode);
            initOledTheme();
        });

        // --- 4. CHILD LOCK SECURITY ENGINE ---
        DOM.childLockBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isChildLocked = !isChildLocked;
            if (isChildLocked) {
                document.getElementById('lock-icon').className = 'fa-solid fa-lock text-red-500 animate-bounce';
                DOM.masterControls.style.opacity = '0'; DOM.roller.style.opacity = '0'; DOM.clockPanel.style.opacity = '0';
                closeAllPanels();
            } else {
                document.getElementById('lock-icon').className = 'fa-solid fa-lock-open text-[#00E676]';
                resetControlsTimer();
            }
        });

        // --- 5. MX PLAYER SWIPE INTERACTIVITY ENGINE ---
        let isDragging = false, startY = 0, activeSide = null, startVal = 0;
        let currentBrightness = 0.3, currentVolume = 0.01; // Restored matching 30% and 1% preferences

        function updateGestureUI(side, value) {
            const percentageInteger = Math.round(value * 100);
            if(side === 'left') {
                DOM.bTxt.innerText = `${percentageInteger}%`; DOM.bFill.style.height = `${percentageInteger}%`;
                DOM.video.style.filter = `brightness(${30 + (value * 120)}%)`;
            } else {
                DOM.vTxt.innerText = `${percentageInteger}%`; DOM.vFill.style.height = `${percentageInteger}%`;
                DOM.video.volume = value;
            }
        }

        DOM.touchArea.addEventListener('pointerdown', (e) => {
            if(isChildLocked) return;
            isDragging = true; startY = e.clientY;
            clearTimeout(hideOverlayTimer);
            const boundingBox = DOM.touchArea.getBoundingClientRect();
            if((e.clientX - boundingBox.left) < boundingBox.width / 2) {
                activeSide = 'left'; startVal = currentBrightness; DOM.bOverlay.style.opacity = '1';
            } else {
                activeSide = 'right'; startVal = currentVolume; DOM.vOverlay.style.opacity = '1';
            }
        });

        // Smart Double Tap Recognition
        let lastTappedTime = 0;
        DOM.touchArea.addEventListener('click', () => {
            if(isChildLocked) return;
            let currentTick = Date.now();
            if((currentTick - lastTappedTime) < 300) DOM.playPauseBtn.click();
            lastTappedTime = currentTick;
        });

        DOM.touchArea.addEventListener('pointermove', (e) => {
            if(!isDragging) return;
            const deltaY = startY - e.clientY;
            let computedValue = Math.max(0, Math.min(1, startVal + (deltaY / 200)));
            if(activeSide === 'left') { currentBrightness = computedValue; updateGestureUI('left', currentBrightness); }
            else { currentVolume = computedValue; updateGestureUI('right', currentVolume); }
        });

        const releaseDrag = () => { isDragging = false; hideOverlayTimer = setTimeout(() => { DOM.bOverlay.style.opacity = '0'; DOM.vOverlay.style.opacity = '0'; }, 1000); };
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt => DOM.touchArea.addEventListener(evt, releaseDrag));
        updateGestureUI('left', currentBrightness); updateGestureUI('right', currentVolume);

        // --- 6. NEAT STATS FOR NERDS HARMONIZER ---
        DOM.nerdBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isNerdHudActive = !isNerdHudActive;
            DOM.statsHud.classList.toggle('hidden', !isNerdHudActive);
        });

        setInterval(() => {
            if (!isNerdHudActive || currentPlayingIndex === -1) return;
            document.getElementById('stat-res').innerText = `${DOM.video.videoWidth}x${DOM.video.videoHeight}`;
            document.getElementById('stat-fps').innerText = hlsPlayer?.id3Size || '24';
            const bandwidthEst = hlsPlayer?.bandwidthEstimate ? (hlsPlayer.bandwidthEstimate / 1000000).toFixed(2) : '0.00';
            document.getElementById('stat-band').innerText = `${bandwidthEst} Mbps`;
            const bufferDuration = DOM.video.buffered.length ? (DOM.video.buffered.end(DOM.video.buffered.length - 1) - DOM.video.currentTime).toFixed(1) : '0.0';
            document.getElementById('stat-buf').innerText = `${bufferDuration}s`;
        }, 1000);

        // --- 7. SMART AI VOICE ENGINE SYSTEM ---
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechEngine = window.SpeechRecognition || window.webkitSpeechRecognition;
            const voiceRunner = new SpeechEngine();
            voiceRunner.continuous = false; voiceRunner.lang = 'en-US';

            DOM.voiceBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('mic-icon').className = 'fa-solid fa-microphone text-red-500 animate-ping';
                voiceRunner.start();
            });

            voiceRunner.onresult = (event) => {
                const vocalQuery = event.results[0][0].transcript.toLowerCase();
                DOM.searchInput.value = vocalQuery;
                document.getElementById('mic-icon').className = 'fa-solid fa-microphone text-[#00E676]';
                const matchedElement = currentChannelsData.find(c => c.name.toLowerCase().includes(vocalQuery));
                if (matchedElement) playChannel(currentChannelsData.indexOf(matchedElement));
            };
            voiceRunner.onerror = () => { document.getElementById('mic-icon').className = 'fa-solid fa-microphone text-gray-400'; };
        } else { DOM.voiceBtn.classList.add('hidden'); }

        // --- 8. SMART SLEEP TIMER CONTROL MODULE ---
        DOM.timerMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            clearInterval(sleepTimerInterval);
            if (sleepTimerMinutes === 0) sleepTimerMinutes = 5;
            else if (sleepTimerMinutes === 5) sleepTimerMinutes = 15;
            else if (sleepTimerMinutes === 15) sleepTimerMinutes = 30;
            else sleepTimerMinutes = 0;

            if (sleepTimerMinutes > 0) {
                document.getElementById('timer-label').innerText = `${sleepTimerMinutes} Mins`;
                DOM.timerMenuBtn.classList.add('text-blue-400');
                sleepTimerInterval = setInterval(() => {
                    sleepTimerMinutes--;
                    if (sleepTimerMinutes <= 0) {
                        clearInterval(sleepTimerInterval);
                        DOM.video.pause();
                        DOM.playPauseBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
                        document.getElementById('timer-label').innerText = "Sleep Off";
                        DOM.timerMenuBtn.classList.remove('text-blue-400');
                    } else {
                        document.getElementById('timer-label').innerText = `${sleepTimerMinutes} Mins`;
                    }
                }, 60000);
            } else {
                document.getElementById('timer-label').innerText = "Sleep Off";
                DOM.timerMenuBtn.classList.remove('text-blue-400');
            }
        });

        // --- 9. BOOKMARKS & HISTORY STATE HANDLERS ---
        DOM.favToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentPlayingIndex === -1) return;
            const targetUrl = currentChannelsData[currentPlayingIndex].url;
            const indexLoc = favoriteChannels.indexOf(targetUrl);
            if (indexLoc === -1) {
                favoriteChannels.push(targetUrl);
                DOM.favToggleBtn.classList.add('text-red-500');
            } else {
                favoriteChannels.splice(indexLoc, 1);
                DOM.favToggleBtn.classList.remove('text-red-500');
            }
            localStorage.setItem('iptv_favorites', JSON.stringify(favoriteChannels));
        });

        function appendWatchHistory(channelObj) {
            historyChannels = historyChannels.filter(url => url !== channelObj.url);
            historyChannels.unshift(channelObj.url);
            if (historyChannels.length > 20) historyChannels.pop(); // Cap history pool size
            localStorage.setItem('iptv_history', JSON.stringify(historyChannels));
        }

        // --- 10. M3U CLOUD PLAYLIST PARSER ENGINE ---
        DOM.playlistLoadBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const playlistUrl = DOM.playlistUrlInput.value.trim();
            if(!playlistUrl) return;

            DOM.gridContainer.innerHTML = '<div class="col-span-full text-center py-12"><i class="fa-solid fa-sync animate-spin text-2xl text-[#00E676]"></i><p class="text-xs mt-2 text-gray-400">Parsing Live Cloud M3U Playlists...</p></div>';
            
            try {
                const fetchRes = await fetch(playlistUrl);
                const rawM3uString = await fetchRes.text();
                parseRawM3uData(rawM3uString);
            } catch(err) {
                DOM.gridContainer.innerHTML = '<p class="text-red-400 col-span-full text-center py-8">Failed to download external m3u source. Check CORS configurations.</p>';
            }
        });

        function parseRawM3uData(textData) {
            const parsedArray = [];
            const lines = textData.split('\n');
            let currentTrack = null;

            lines.forEach(line => {
                line = line.trim();
                if(line.startsWith('#EXTINF:')) {
                    currentTrack = { name: 'Unknown IPTV Channel', logo: '', url: '' };
                    const nameMatch = line.match(/,(.+)$/);
                    if(nameMatch) currentTrack.name = nameMatch[1].trim();
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    if(logoMatch) currentTrack.logo = logoMatch[1];
                } else if(line.startsWith('http') && currentTrack) {
                    currentTrack.url = line;
                    parsedArray.push(currentTrack);
                    currentTrack = null;
                }
            });

            if(parsedArray.length > 0) {
                currentChannelsData = parsedArray;
                renderChannels(currentChannelsData);
                // Dynamically update the default tab indicator flag
                DOM.tabsContainer.children[1].innerText = "Parsed Playlist";
                DOM.tabsContainer.children[1].click();
            } else {
                DOM.gridContainer.innerHTML = '<p class="text-yellow-500 col-span-full text-center py-8">No channels matching pattern found inside document file.</p>';
            }
        }

        // --- 11. STREAM AUTO HEALER ROUTINE ---
        function initAutoHealer() {
            clearInterval(streamAutoHealerTicker);
            stuckCounter = 0;
            streamAutoHealerTicker = setInterval(() => {
                if (DOM.video.paused) return;
                if (DOM.video.currentTime === lastVideoTime) {
                    stuckCounter++;
                    if (stuckCounter >= 4) {
                        stuckCounter = 0;
                        if (hlsPlayer) hlsPlayer.recoverMediaError();
                        else playChannel(currentPlayingIndex);
                    }
                } else { stuckCounter = 0; }
                lastVideoTime = DOM.video.currentTime;
            }, 1000);
        }

        // --- 12. MX VERTICAL CHANNEL ROLLER ---
        function renderChannelRoller(currentIndex) {
            DOM.roller.innerHTML = '';
            if(currentChannelsData.length <= 1) return;
            const total = currentChannelsData.length;
            const prevIndex = (currentIndex - 1 + total) % total;
            const nextIndex = (currentIndex + 1) % total;

            [{ idx: prevIndex, type: 'side' }, { idx: currentIndex, type: 'active' }, { idx: nextIndex, type: 'side' }].forEach(slot => {
                const channel = currentChannelsData[slot.idx];
                const cleanName = channel.name.replace(/^(BD\s*\|\s*|IN\s*\|\s*|EN\s*\|\s*|OTHER\s*\|\s*|TR\s*\|\s*|ENT\s*\|\s*)/i, '').trim();
                const btn = document.createElement('button');
                btn.className = "roller-item flex flex-col items-center justify-center";
                
                if(slot.type === 'active') {
                    btn.innerHTML = channel.logo ? `<img src="${channel.logo}" class="w-10 h-10 object-contain rounded-full border-2 border-[#00E676] bg-white p-0.5 shadow-[0_0_12px_#00E676]">` : `<div class="w-10 h-10 rounded-full bg-[#00E676] text-black font-black flex items-center justify-center text-xs shadow-[0_0_12px_#00E676]">${cleanName.charAt(0)}</div>`;
                } else {
                    btn.innerHTML = channel.logo ? `<img src="${channel.logo}" class="w-7 h-7 object-contain rounded-full bg-white/20 p-0.5 opacity-40 hover:opacity-100">` : `<div class="w-7 h-7 rounded-full bg-gray-800 text-gray-500 flex items-center justify-center text-[10px] opacity-40">${cleanName.charAt(0)}</div>`;
                    btn.onclick = (e) => { e.stopPropagation(); playChannel(slot.idx); };
                }
                DOM.roller.appendChild(btn);
            });
        }

        // Aspect and Scaling Rate Maps
        window.cycleAspectRatio = function() {
            currentAspectIdx = (currentAspectIdx + 1) % aspectRatios.length;
            aspectRatios.forEach(cls => DOM.video.classList.remove(cls));
            DOM.video.classList.add(aspectRatios[currentAspectIdx]);
            DOM.aspectBtnTxt.innerText = aspectLabels[currentAspectIdx].split(' ')[0];
            DOM.hudText.innerText = aspectLabels[currentAspectIdx];
        };

        window.cyclePlaybackSpeed = function() {
            currentSpeedIdx = (currentSpeedIdx + 1) % playSpeeds.length;
            DOM.video.playbackRate = playSpeeds[currentSpeedIdx];
            DOM.speedBtn.innerText = `${playSpeeds[currentSpeedIdx]}x`;
        };

        DOM.rotateBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) DOM.videoWrapper.classList.toggle('simulated-landscape');
            else if (screen.orientation?.lock) screen.orientation.type.includes('portrait') ? screen.orientation.lock('landscape') : screen.orientation.lock('portrait');
        });

        DOM.playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if(DOM.video.paused) { DOM.video.play(); DOM.playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>'; }
            else { DOM.video.pause(); DOM.playPauseBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>'; }
        });

        document.getElementById('pip-btn').addEventListener('click', async (e) => {
            e.stopPropagation();
            try { DOM.video !== document.pictureInPictureElement ? await DOM.video.requestPictureInPicture() : await document.exitPictureInPicture(); } catch (err) {}
        });

        document.getElementById('fullscreen-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) DOM.videoWrapper.requestFullscreen(); else document.exitFullscreen();
        });

        // --- Tabs Initialization Framework ---
        function initTabs() {
            DOM.tabsContainer.innerHTML = '';
            
            // Favorite Category Tab Container
            const favBtn = document.createElement('button');
            favBtn.className = "px-5 py-2 rounded-full text-sm font-bold bg-[#1e293b] text-red-400 flex-shrink-0 hover:bg-red-950/40 border border-red-500/20";
            favBtn.innerHTML = "<i class='fa-solid fa-heart mr-1'></i> Favorites";
            favBtn.onclick = () => {
                clearTabActiveClasses();
                favBtn.className = "px-5 py-2 rounded-full text-sm font-bold bg-red-600 text-white flex-shrink-0 shadow-lg font-black";
                const filteredFavs = currentChannelsData.filter(c => favoriteChannels.includes(c.url));
                renderChannels(filteredFavs);
            };
            DOM.tabsContainer.appendChild(favBtn);

            // History Category Tab Container
            const histBtn = document.createElement('button');
            histBtn.className = "px-5 py-2 rounded-full text-sm font-bold bg-[#1e293b] text-blue-400 flex-shrink-0 hover:bg-blue-950/40 border border-blue-500/20 mr-2";
            histBtn.innerHTML = "<i class='fa-solid fa-history mr-1'></i> Recents";
            histBtn.onclick = () => {
                clearTabActiveClasses();
                histBtn.className = "px-5 py-2 rounded-full text-sm font-bold bg-blue-600 text-white flex-shrink-0 shadow-lg font-black";
                const filteredHist = currentChannelsData.filter(c => historyChannels.includes(c.url));
                renderChannels(filteredHist);
            };
            DOM.tabsContainer.appendChild(histBtn);

            categoryFiles.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.className = index === 0 ? "px-5 py-2 rounded-full text-sm font-bold bg-[#00E676] text-black flex-shrink-0 shadow-lg font-black" : "px-5 py-2 rounded-full text-sm font-bold bg-[#1e293b] text-gray-300 flex-shrink-0 hover:bg-[#334155]";
                btn.textContent = cat.name;
                btn.onclick = () => {
                    clearTabActiveClasses();
                    btn.className = "px-5 py-2 rounded-full text-sm font-bold bg-[#00E676] text-black flex-shrink-0 shadow-lg font-black";
                    DOM.searchInput.value = '';
                    loadChannelData(cat.file);
                };
                DOM.tabsContainer.appendChild(btn);
            });
            loadChannelData(categoryFiles[0].file);
        }

        function clearTabActiveClasses() {
            Array.from(DOM.tabsContainer.children).forEach(b => {
                if(b.innerText.includes("Favorites")) b.className = "px-5 py-2 rounded-full text-sm font-bold bg-[#1e293b] text-red-400 flex-shrink-0 hover:bg-red-950/40 border border-red-500/20";
                else if(b.innerText.includes("Recents")) b.className = "px-5 py-2 rounded-full text-sm font-bold bg-[#1e293b] text-blue-400 flex-shrink-0 hover:bg-blue-950/40 border border-blue-500/20 mr-2";
                else b.className = "px-5 py-2 rounded-full text-sm font-bold bg-[#1e293b] text-gray-300 flex-shrink-0 hover:bg-[#334155]";
            });
        }

        async function loadChannelData(fileName) {
            DOM.gridContainer.innerHTML = '<div class="col-span-full text-center py-12"><i class="fa-solid fa-spinner animate-spin text-2xl text-[#00E676]"></i></div>';
            try {
                const response = await fetch(fileName);
                currentChannelsData = await response.json();
                renderChannels(currentChannelsData);
            } catch (error) {
                DOM.gridContainer.innerHTML = '<p class="text-red-400 col-span-full text-center py-8">Channels list unavailable or network issue.</p>';
            }
        }

        DOM.searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = currentChannelsData.filter(channel => channel.name.toLowerCase().includes(searchTerm));
            renderChannels(filtered);
        });

        // --- ULTRA FAST CHANNELS CONNECTION DISPATCHER ---
        function playChannel(index, dataArray = currentChannelsData) {
            if (index < 0 || index >= dataArray.length) return;
            const channel = dataArray[index];
            currentPlayingIndex = currentChannelsData.findIndex(c => c.url === channel.url);
            const cleanName = channel.name.replace(/^(BD\s*\|\s*|IN\s*\|\s*|EN\s*\|\s*|OTHER\s*\|\s*|TR\s*\|\s*|ENT\s*\|\s*)/i, '').trim();
            
            DOM.placeholder.classList.add('hidden');
            DOM.popupText.innerText = cleanName;
            DOM.channelPopup.classList.remove('opacity-0');
            clearTimeout(popupTimer); popupTimer = setTimeout(() => DOM.channelPopup.classList.add('opacity-0'), 2000);

            // Dynamic Backdrop Color Sync Engine
            const premiumNeonPalettes = ['rgba(0,230,118,0.22)', 'rgba(0,184,212,0.22)', 'rgba(213,0,249,0.22)', 'rgba(255,214,0,0.22)'];
            DOM.ambientGlow.style.background = premiumNeonPalettes[Math.floor(Math.random() * premiumNeonPalettes.length)];

            DOM.favToggleBtn.classList.toggle('text-red-500', favoriteChannels.includes(channel.url));

            appendWatchHistory(channel);
            renderChannelRoller(currentPlayingIndex);
            resetControlsTimer();
            initAutoHealer();

            DOM.video.style.opacity = '0.4';

            if (Hls.isSupported()) {
                if (hlsPlayer) hlsPlayer.destroy();
                hlsPlayer = new Hls({ 
                    enableWorker: true, lowLatencyMode: true, capLevelToPlayerSize: true, 
                    startLevel: -1, autoStartLoad: true, maxBufferLength: 4
                }); 
                hlsPlayer.loadSource(channel.url); hlsPlayer.attachMedia(DOM.video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => { DOM.video.play(); DOM.video.style.opacity = '1'; DOM.playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>'; });
            } else if (DOM.video.canPlayType('application/vnd.apple.mpegurl')) {
                DOM.video.src = channel.url; DOM.video.play(); DOM.video.style.opacity = '1';
            }
        }

        // Renders Grid Catalog with Expandable Peek Enhancements
        function renderChannels(channels) {
            DOM.gridContainer.innerHTML = '';
            if (!channels.length) { DOM.gridContainer.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">No channels inside selected catalog context.</p>'; return; }

            channels.forEach((channel) => {
                const cleanName = channel.name.replace(/^(BD\s*\|\s*|IN\s*\|\s*|EN\s*\|\s*|OTHER\s*\|\s*|TR\s*\|\s*|ENT\s*\|\s*)/i, '').trim();
                const card = document.createElement('button');
                card.className = "channel-card-peek aspect-square bg-gray-900/40 backdrop-blur rounded-2xl flex flex-col items-center justify-center p-3 transition-all duration-300 border border-white/5 relative overflow-hidden group";
                
                // Add an elegant animated soundwave preview peek bar inside card element
                const soundwaveHtml = `<div class="absolute bottom-1 right-2 flex items-end space-x-0.5 h-3 opacity-0 group-hover:opacity-100 transition-opacity"><span class="w-0.5 bg-[#00E676] animate-pulse h-2"></span><span class="w-0.5 bg-[#00E676] animate-pulse h-3"></span><span class="w-0.5 bg-[#00E676] animate-pulse h-1"></span></div>`;

                const logoHtml = channel.logo ? `<img src="${channel.logo}" alt="" class="w-12 h-12 object-contain rounded-full bg-white p-1 mb-2 transform group-hover:scale-110 transition-transform">` : `<div class="w-12 h-12 rounded-full bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center text-[#00E676] font-bold mb-2 group-hover:shadow-[0_0_8px_#00E676] transition-all">${cleanName.charAt(0)}</div>`;
                card.innerHTML = `${logoHtml}<span class="text-[11px] font-medium text-gray-300 text-center truncate w-full group-hover:text-[#00E676] transition-colors">${cleanName}</span>${soundwaveHtml}`;

                card.onclick = () => { 
                    const targetOriginIdx = currentChannelsData.findIndex(c => c.url === channel.url);
                    playChannel(targetOriginIdx !== -1 ? targetOriginIdx : 0, targetOriginIdx !== -1 ? currentChannelsData : channels); 
                    window.scrollTo({ top: 0, behavior: 'smooth' }); 
                };
                DOM.gridContainer.appendChild(card);
            });
        }

        initTabs();
    </script>
</body>
</html>
